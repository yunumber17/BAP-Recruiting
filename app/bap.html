function calMonthView(events) {
  const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(1);
  base.setMonth(base.getMonth() + (S.calMonth || 0));
  const year = base.getFullYear(), month = base.getMonth();
  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const byDay = {};
  events.forEach(e => { const d = _parseLocalDate(e.date); if (d && !isNaN(d) && d.getFullYear() === year && d.getMonth() === month) { const k = d.getDate(); (byDay[k] = byDay[k] || []).push(e); } });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const isThisMonth = today.getFullYear() === year && today.getMonth() === month;
  const sel = S.calDay || null;

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div></div>');
  for (let day = 1; day <= daysInMonth; day++) {
    const has = (byDay[day] || []).length;
    const isToday = isThisMonth && today.getDate() === day;
    const isSel = sel === day;
    cells.push(`<div onclick="S.calDay=${isSel ? 'null' : day};render()" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px;cursor:pointer;background:${isSel ? 'var(--navy)' : isToday ? 'var(--blue-bg,#eaf2fc)' : 'transparent'}">
      <div style="font-size:13px;font-weight:${isToday || isSel ? '800' : '500'};color:${isSel ? '#fff' : isToday ? 'var(--blue)' : 'var(--text2)'}">${day}</div>
      <div style="width:5px;height:5px;border-radius:50%;background:${has ? (isSel ? '#fff' : 'var(--amber)') : 'transparent'}"></div>
    </div>`);
  }
  const dow = ['日', '月', '火', '水', '木', '金', '土'];
  const selEvents = sel ? (byDay[sel] || []) : [];
  return `
    <div style="padding:16px 20px 0">
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2,#f4f6f9);font-size:18px;color:var(--text2)" onclick="S.calMonth=(S.calMonth||0)-1;S.calDay=null;render()">‹</div>
          <div style="font-size:15px;font-weight:800">${year}年${month + 1}月</div>
          <div style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2,#f4f6f9);font-size:18px;color:var(--text2)" onclick="S.calMonth=(S.calMonth||0)+1;S.calDay=null;render()">›</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
          ${dow.map(d => `<div style="text-align:center;font-size:11px;font-weight:700;color:var(--text3);padding:4px 0">${d}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells.join('')}</div>
      </div>
    </div>
    <div class="sec" style="margin-top:16px;padding-bottom:32px">
      ${sel ? `<div class="t11" style="margin-bottom:10px">${month + 1}月${sel}日の予定${selEvents.length ? `（${selEvents.length}）` : ''}</div>
        ${selEvents.length ? `<div style="display:flex;flex-direction:column;gap:8px">${selEvents.map(calEventCard).join('')}</div>`
          : `<div class="card" style="padding:16px;font-size:13px;color:var(--text3)">この日の予定はありません。</div>`}`
        : `<div class="card" style="padding:16px;font-size:13px;color:var(--text3);line-height:1.7">日付をタップすると、その日の予定が表示されます。<span style="color:var(--amber)">●</span> は予定のある日です。</div>`}
    </div>`;
}

function renderCalendar() {
  const events = buildRecruitingCalendar();
  const view = S.calView || 'agenda';
  const tab = (k, l) => `<div onclick="S.calView='${k}';render()" style="flex:1;text-align:center;padding:10px;font-size:13px;font-weight:700;cursor:pointer;border-radius:10px;background:${view === k ? 'var(--navy)' : 'transparent'};color:${view === k ? '#fff' : 'var(--text3)'}">${l}</div>`;

  const g = calGroups(events);

    <div style="display:flex;flex-direction:column;gap:8px">${arr.map(calEventCard).join('')}</div>
  </div>` : '';

  const agenda = events.length ? `
    ${section('期限切れ・要対応', g.overdue)}

    ${section('明日', g.tomorrow)}

  return `<div class="anim">
    <div style="padding:52px 20px 16px;background:var(--white);border-bottom:1px solid var(--border)">
      <div class="back" onclick="closeSub()">戻る</div>
      <div class="t22" style="margin-top:16px">リクルーティングカレンダー</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">予定・締切・フォローアップを1か所にまとめました</div>
      <div style="display:flex;gap:6px;margin-top:16px;background:var(--bg2,#f4f6f9);padding:4px;border-radius:12px">
        ${tab('agenda', '7日間')}${tab('month', '月表示')}
      </div>

  </div>`;
}

// ── 今週のリクルーティングレポート（週次の変化を表示） ───────────────────────
// Computes genuine week-over-week deltas WITHOUT storing snapshots: it rebuilds
// "your state as of 7 days ago" by excluding rows created in the last 7 days
// (using existing created_at / sent_at / measured_at timestamps), then recomputes
// readiness and match against that reconstructed state. Deterministic, no schema.
function _cutDaysAgo(days) { const d = new Date(); d.setDate(d.getDate() - days); return d; }
function _rowTs(r) { return r.created_at || r.measured_at || r.sent_at || r.last_activity_at || null; }
function _before(rows, cut) { return (rows || []).filter(r => { const t = _rowTs(r); return t && new Date(t) < cut; }); }
function _after(rows, cut) { return (rows || []).filter(r => { const t = _rowTs(r); return t && new Date(t) >= cut; }); }
function _msgsFlat() { return Object.values(BAP_STATE.messagesByContact || {}).reduce((a, b) => a.concat(b || []), []); }
function _msgsBefore(cut) {
  const o = BAP_STATE.messagesByContact || {}, out = {};
  Object.keys(o).forEach(k => { out[k] = (o[k] || []).filter(m => { const t = m.sent_at || m.created_at; return t && new Date(t) < cut; }); });
  return out;
}
// Run fn with temporary overrides on BAP_STATE, then restore.
function _withState(over, fn) {
  const keys = Object.keys(over), backup = {};
  keys.forEach(k => { backup[k] = BAP_STATE[k]; BAP_STATE[k] = over[k]; });
  try { return fn(); } finally { keys.forEach(k => { BAP_STATE[k] = backup[k]; }); }
}
function _avgMatchSaved() {
  const schools = (BAP_STATE.saved || []).map(s => findCollege(s.college_id)).filter(Boolean);
  if (!schools.length) return null;
  return Math.round(schools.reduce((a, c) => a + computeMatch(c).score, 0) / schools.length);
}
// Projected average-match impact of fixing a gap (simulated, clearly an estimate).
function _projectGap(id) {
  const p = BAP_STATE.player || {};
  const over = id === 'video' ? { videos: [{}] }
    : id === 'toefl' ? { player: Object.assign({}, p, { toefl: 75 }) }
    : id === 'test' ? { player: Object.assign({}, p, { sat: 1150 }) }
    : id === 'gpa' ? { player: Object.assign({}, p, { gpa: 3.5 }) }
    : id === 'coach' ? { contacts: [...(BAP_STATE.contacts || []), {}] }
    : null;
  if (!over) return null;
  const base = _avgMatchSaved();
  if (base == null) return null;
  const proj = _withState(over, () => _avgMatchSaved());
  return proj != null ? proj - base : null;
}
function buildReport() {
  const cut = _cutDaysAgo(7);
  const videos = BAP_STATE.videos || [], contacts = BAP_STATE.contacts || [], saved = BAP_STATE.saved || [];
  const metrics = BAP_STATE.metrics || [], goals = BAP_STATE.goals || [], docs = BAP_STATE.documents || [];

  const readinessNow = readinessPct();
  const avgNow = _avgMatchSaved();

  const prevInputs = { videos: _before(videos, cut), contacts: _before(contacts, cut), metrics: _before(metrics, cut), documents: _before(docs, cut), messagesByContact: _msgsBefore(cut) };
  const readinessPrev = _withState(Object.assign({}, prevInputs, { goals: _before(goals, cut), saved: _before(saved, cut) }), () => readinessPct());
  const avgPrev = _withState(prevInputs, () => _avgMatchSaved());

  const act = [];
  const nv = _after(videos, cut).length; if (nv) act.push(`ハイライト動画を${nv}本追加しました`);
  const nc = _after(contacts, cut).length; if (nc) act.push(`新しいコーチを${nc}人追加しました`);
  const ns = _after(saved, cut).length; if (ns) act.push(`志望校を${ns}校保存しました`);
  const nmet = _after(metrics, cut).length; if (nmet) act.push(`パフォーマンス指標を${nmet}件登録しました`);
  const nmsg = _msgsFlat().filter(m => { const t = m.sent_at || m.created_at; return t && new Date(t) >= cut; }).length; if (nmsg) act.push(`コーチとのやり取りを${nmsg}件記録しました`);

  const warn = [];
  const inbound = _msgsFlat().filter(m => m.direction === 'inbound').length;
  if (contacts.length > 0 && inbound === 0) warn.push('コーチからの返信がまだ記録されていません');
  if (saved.length === 0) warn.push('志望校がまだ保存されていません');
  if (videos.length === 0) warn.push('ハイライト動画が未登録です');

  let opp = null;
  if (saved.length > 0) {
    const gaps = buildStrategy().gaps || [];
    if (gaps.length) { const g = gaps[0]; opp = { label: g.label, schools: g.count, delta: _projectGap(g.id) }; }
  } else if (videos.length === 0) opp = { label: 'ハイライト動画を追加する', schools: null, delta: null };
  else if (!(parseFloat((BAP_STATE.player || {}).toefl) > 0)) opp = { label: 'TOEFLスコアを入力する', schools: null, delta: null };

  return { readinessNow, readinessPrev, avgNow, avgPrev, act, warn, opp, hasSaved: saved.length > 0 };
}

function _deltaLine(prev, now, unit) {
  const d = now - prev;
  const arrow = d > 0 ? '↑' : (d < 0 ? '↓' : '→');
  const col = d > 0 ? 'var(--green)' : (d < 0 ? 'var(--amber)' : 'var(--text3)');
  return `<span style="color:var(--text2)">${prev}${unit}</span> <span style="color:${col};font-weight:800">${arrow} ${now}${unit}</span>${d !== 0 ? ` <span style="color:${col};font-size:12px">(${d > 0 ? '+' : ''}${d})</span>` : ''}`;
}

// ── リクルーティングロードマップ（動的・データ連動） ─────────────────────────
// A living recruiting plan. Every task's done/undone state is derived from the
// player's real BAP_STATE, so it updates automatically whenever they edit their
// profile, add metrics/video, save colleges, or contact coaches. Deterministic.
function roadmapGoal() {
  const p = BAP_STATE.player || {};
  const tgt = (p.target_division || '').split(',')[0].trim();
  return S.roadmapGoal || (DIVISIONS.includes(tgt) ? tgt : 'D2');
}
function roadmapStage(yearsLeft) {
  if (yearsLeft == null) return { label: '', note: '卒業年度を入力すると、時期に合わせた提案が表示されます。' };
  if (yearsLeft >= 3) return { label: '基礎構築期', note: 'プロフィール・学力・動画など、土台づくりに集中する時期です。' };
  if (yearsLeft === 2) return { label: '発展期', note: '競技力を高め、志望校リストを作り始める時期です。' };
  if (yearsLeft === 1) return { label: '実行期', note: 'コーチへの連絡と出願準備を本格化させる時期です。' };
  return { label: '出願・最終期', note: '出願とフォローアップを確実に進める時期です。' };
}
function buildRoadmap(goal) {
  const p = BAP_STATE.player || {};
  const has = v => v != null && v !== '';
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const missing = _dcProfileMissing();
  const gpa = parseFloat(p.gpa), toefl = parseFloat(p.toefl), sat = parseFloat(p.sat), act = parseFloat(p.act);
  const metrics = BAP_STATE.metrics || [], defs = BAP_STATE.metricDefs || [];
  const videos = (BAP_STATE.videos || []).length, saved = (BAP_STATE.saved || []).length;
  const contacts = (BAP_STATE.contacts || []).length, messages = _dcMessageCount();
  const gT = DIVISION_BENCH.gpa[goal], tT = DIVISION_BENCH.toefl[goal];
  const yearsLeft = p.grad_year ? (p.grad_year - new Date().getFullYear()) : null;

  const athKeys = Object.keys(DIVISION_BENCH.athletic).filter(k => latestMetricValue(k) != null); // season-aware
  const athTasks = [{ label: 'パフォーマンス指標を登録する', done: athKeys.length > 0, act: "S.profileTab='metrics';go('profile')", why: '球速や走力などの数値がないと評価されにくいためです。' }];
  athKeys.forEach(key => {
    const target = DIVISION_BENCH.athletic[key][goal];
    if (!target) return;
    const v = latestMetricValue(key), lower = LOWER_BETTER.includes(key), ok = lower ? v <= target : v >= target;
    const def = defs.find(d => d.metric_key === key);
    athTasks.push({ label: `${def ? def.label_ja : metricLabel(key)}を${target}${def ? def.unit : ''}${lower ? '以下' : '以上'}へ`, done: ok, act: null, why: `${goal}で通用する水準を目指すためです。` });
  });

  const phases = [
    { key: 'profile', title: 'プロフィール構築', tasks: [
      { label: '基本情報を入力（氏名・高校・卒業年度・ポジション）', done: has(p.name) && has(p.school) && has(p.grad_year) && has(p.position), act: 'openProfileEdit()', why: 'コーチが最初に確認する基本項目です。' },
      { label: '身長・体重を登録する', done: has(p.height_cm) && has(p.weight_kg), act: 'openProfileEdit()', why: 'ポジション適性の評価に使われます。' },
      { label: 'プロフィールを100%完成させる', done: missing.length === 0, act: 'openProfileEdit()', why: '完成度が高いほど信頼されます。' },
    ]},
    { key: 'academics', title: '学力向上', tasks: [
      { label: 'GPAを入力する', done: hasNum(gpa), act: 'openProfileEdit()', why: '学業成績はNCAAの出願資格に直結します。' },
      { label: `GPAを${gT}以上にする（${goal}目安）`, done: hasNum(gpa) && gpa >= gT, act: null, why: '志望レベルの学業基準を満たすためです。' },
      { label: 'TOEFL・SAT・ACTのいずれかを入力する', done: hasNum(toefl) || hasNum(sat) || hasNum(act), act: 'openProfileEdit()', why: '英語力・学力の客観的な証明になります。' },
    ]},
    { key: 'athletic', title: '身体能力・競技力向上', tasks: athTasks },
    { key: 'video', title: 'ハイライト動画', tasks: [
      { label: 'ハイライト動画をアップロードする', done: videos > 0, act: "S.profileTab='videos';go('profile')", why: 'ハイライト動画はコーチが最初に確認する資料の一つです。' },
    ]},
    { key: 'colleges', title: '大学リスト作成', tasks: [
      { label: '志望校を保存する', done: saved > 0, act: "S.collegeView='search';go('colleges')", why: '目標が明確になり、連絡先も整理できます。' },
      { label: '志望校を5校以上に広げる', done: saved >= 5, act: "S.collegeView='search';go('colleges')", why: '選択肢を確保してリスクを分散します。' },
    ]},
    { key: 'coach', title: 'コーチへの連絡', tasks: [
      { label: '最初のコーチに連絡する', done: contacts > 0, act: 'openAddContact()', why: 'リクルートは自分から動くことで始まります。' },
      { label: 'やり取りを記録して継続する', done: messages > 0, act: "go('coach')", why: '関係の進捗を管理できます。' },
      { label: '5人以上のコーチに連絡する', done: contacts >= 5, act: 'openAddContact()', why: '接触数がチャンスを増やします。' },
    ]},
    { key: 'apply', title: '出願準備', tasks: [
      { label: '英語試験スコアを確定する', done: hasNum(toefl) || hasNum(sat) || hasNum(act), act: 'openProfileEdit()', why: '出願要件の一つです。' },
      { label: 'コーチへのフォローアップを行う', done: messages > 0 && contacts > 0, act: "go('coach')", why: '関心を維持してもらうために重要です。' },
      { label: '志望校の出願要件を確認する', done: saved > 0, act: "S.collegeView='saved';go('colleges')", why: '締切と必要書類を把握します。' },
    ]},
  ];
  phases.forEach(ph => {
    ph.total = ph.tasks.length;
    ph.done = ph.tasks.filter(t => t.done).length;
    ph.status = ph.done === ph.total ? 'done' : (ph.done > 0 ? 'active' : 'todo');
  });
  const total = phases.reduce((s, ph) => s + ph.total, 0);
  const done = phases.reduce((s, ph) => s + ph.done, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  return { phases, yearsLeft, goal, pct, total, done };
}

  const p = BAP_STATE.player;

  if (status === 'done') return '<span class="badge b-green">完了済み</span>';

  return '<span class="badge b-gray">次にやること</span>';
}

    ${priority ? `<div style="padding:20px 20px 0">

        ${priority.task.act ? `<button style="background:#fff;color:var(--navy);border:none;height:42px;padding:0 22px;border-radius:21px;font-weight:700;font-size:14px;cursor:pointer" onclick="${priority.task.act}">今すぐ進める</button>` : ''}

    </div>` : `<div style="padding:20px 20px 0"><div class="card" style="padding:18px;text-align:center;font-size:14px;color:var(--text2)">すべての項目が完了しています。素晴らしい進捗です。</div></div>`}

    ${nextPhase ? `<div style="padding:12px 20px 0"><div style="font-size:12px;color:var(--text3);line-height:1.7">次のフェーズに進むには「<b style="color:var(--text2)">${nextPhase.title}</b>」の残りを進めましょう。</div></div>` : ''}

    <!-- Phases -->
    <div style="padding:16px 20px 32px;display:flex;flex-direction:column;gap:12px">
      ${r.phases.map(ph => `<div class="card" style="padding:14px 16px">

      </div>`).join('')}
      <div style="font-size:11px;color:var(--text3);margin-top:2px;line-height:1.7">※ このロードマップは現在のプロフィールに基づく提案です。データを更新すると自動的に反映されます。合否や勧誘を保証するものではありません。</div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// RECRUITING TIMELINE (interactive "story") — PURE PRESENTATION LAYER.
// Derived ONLY from existing sources (seasons, awards, metrics, videos, coach
// interactions, saved schools, decision milestones, calendar events). It MERGES
// and SORTS by real timestamp into one deterministic stream and DEEP-LINKS each
// event to its source. No new table, no duplicated storage, no fabricated events,
// no AI, no scoring. Missing data simply produces no event.
// ════════════════════════════════════════════════════════════════════════════
const TIMELINE_CATS = {
  baseball:      { label: '野球', icon: '⚾', color: 'var(--navy)' },
  videos:        { label: '動画', icon: '🎥', color: 'var(--blue)' },
  communication: { label: '連絡', icon: '📧', color: '#7c3aed' },
  visits:        { label: '訪問', icon: '🏫', color: 'var(--amber)' },
  applications:  { label: '出願', icon: '📝', color: 'var(--green)' },
};
const TIMELINE_CAT_ORDER = ['baseball', 'videos', 'communication', 'visits', 'applications'];

function buildTimelineEvents() {
  const ev = [];
  const push = (iso, cat, icon, title, sub, onclick, extra) => {
    if (!iso) return; const d = new Date(iso); if (isNaN(d)) return;
    ev.push(Object.assign({ ms: d.getTime(), iso, cat, icon, title: title || '', sub: sub || '', onclick: onclick || '', schoolId: null, seasonId: null }, extra || {}));
  };
  // Seasons + awards (baseball)
  playerSeasons().forEach(s => {
    const info = s.info || {}; const iso = new Date(_seasonStartMs(s)).toISOString();
    push(iso, 'baseball', '⚾', s.season_label || 'シーズン', [info.grade, info.level, info.primary_pos].filter(Boolean).join(' · '), `openSub('career')`, { seasonId: s.id });
    if (info.awards) push(iso, 'baseball', '🏆', `受賞: ${info.awards}`, s.season_label || '', `openSub('career')`, { seasonId: s.id });
  });
  // Metrics (baseball)
  (BAP_STATE.metrics || []).forEach(m => push(m.measured_at, 'baseball', '📈', `${metricLabel(m.metric_key)} ${m.value}${m.unit || ''}`, '測定', `S.profileTab='metrics';go('profile')`));
  // Videos
  (BAP_STATE.videos || []).forEach(v => {
    const link = v.storage_path && /^https?:\/\//.test(v.storage_path) ? v.storage_path : '';
    push(v.created_at, 'videos', '🎥', v.title || videoKindJp(v.kind) || '動画', videoKindJp(v.kind) || '', link ? `window.open('${link}','_system')` : `openVideos()`, { seasonId: v.season_id || null });
  });
  // Coach interactions (communication / visits)
  (BAP_STATE.contacts || []).forEach(c => {
    const school = c.college_id ? findCollege(c.college_id) : null;
    push(c.created_at, 'communication', '👤', `コーチを追加: ${c.coach_name || ''}`, school ? school.name : '', `openSub('contact','${c.id}')`, { schoolId: c.college_id || null });
    (BAP_STATE.messagesByContact[String(c.id)] || []).forEach(m => {
      const k = interactionKind(m), meta = INTERACTION_META[k] || { label: 'やり取り' };
      const isVisit = ['visit', 'camp', 'showcase'].includes(k);
      const icon = k === 'call' ? '📞' : k === 'email_in' ? '📩' : k === 'email_out' ? '📧' : k === 'questionnaire' ? '📋' : k === 'text' ? '💬' : k === 'reminder' ? '⏰' : isVisit ? '🏫' : '📝';
      push(m.sent_at || m.created_at, isVisit ? 'visits' : 'communication', icon, `${meta.label}${c.coach_name ? ': ' + c.coach_name : ''}`, school ? school.name : '', `openSub('contact','${c.id}')`, { schoolId: c.college_id || null });
    });
  });
  // Saved schools + decision milestones (applications)
  (BAP_STATE.saved || []).forEach(s => {
    const c = findCollege(s.college_id);
    push(s.created_at, 'applications', '📌', `志望校を保存: ${c ? c.name : ''}`, '', `openHub('${s.college_id}')`, { schoolId: s.college_id });
    const dc = decisionCode(s.decision_status);
    if (dc && dc !== 'saved' && DECISION_STATUS[dc]) {
      const icon = dc === 'offer' ? '🎉' : dc === 'committed' ? '✅' : dc === 'applying' ? '📝' : dc === 'closed' ? '⛔' : '📍';
      push(s.updated_at || s.created_at, 'applications', icon, `${DECISION_STATUS[dc].label}: ${c ? c.name : ''}`, '', `openHub('${s.college_id}','decision')`, { schoolId: s.college_id });
    }
  });
  // Calendar events (visits / baseball)
  (BAP_STATE.events || []).forEach(e => {
    const t = ((e.event_type || e.kind || '') + ' ' + (e.title || '')).toLowerCase();
    const isVisit = /visit|訪問|campus|tour/.test(t);
    push(e.event_date, isVisit ? 'visits' : 'baseball', isVisit ? '🏫' : '🏕', e.title || 'イベント', e.location || '', `openSub('calendar')`);
  });
  return ev.sort((a, b) => b.ms - a.ms); // newest first
}

// Bucket events into season windows (same windows as the Career Hub). null if no seasons.
function _timelineSeasonBuckets(events) {
  const seasons = playerSeasons(); // ascending
  if (!seasons.length) return null;
  const starts = seasons.map(_seasonStartMs);
  return seasons.map((s, i) => {
    const start = i === 0 ? -Infinity : starts[i];
    const end = i === seasons.length - 1 ? Infinity : starts[i + 1];
    return { label: s.season_label || `シーズン${i + 1}`, events: events.filter(e => e.ms >= start && e.ms < end) };
  });
}

function toggleTlCat(cat) { S.tlCatOff = Object.assign({}, S.tlCatOff); S.tlCatOff[cat] = !S.tlCatOff[cat]; render(); }

function renderJourney() {
  const all = buildTimelineEvents();
  const offCats = S.tlCatOff || {};
  const school = S.tlSchool || 'all';
  const group = S.tlGroup || 'season';
  let evs = all.filter(e => !offCats[e.cat]);
  if (school !== 'all') evs = evs.filter(e => String(e.schoolId) === String(school));
  const asc = evs.slice().sort((a, b) => a.ms - b.ms); // story order: oldest → newest

  // Grouping / zoom
  let groups;
  if (group === 'all') groups = asc.length ? [{ label: 'すべて', events: asc }] : [];
  else if (group === 'year') {
    const by = {}; asc.forEach(e => { const y = new Date(e.ms).getFullYear(); (by[y] = by[y] || []).push(e); });
    groups = Object.keys(by).sort().map(y => ({ label: `${y}年`, events: by[y] }));
  } else {
    const b = _timelineSeasonBuckets(asc);
    if (b) groups = b.filter(g => g.events.length);
    else { const by = {}; asc.forEach(e => { const y = new Date(e.ms).getFullYear(); (by[y] = by[y] || []).push(e); }); groups = Object.keys(by).sort().map(y => ({ label: `${y}年`, events: by[y] })); }
  }

  const savedSchools = (BAP_STATE.saved || []).map(s => findCollege(s.college_id)).filter(Boolean);
  const seg = (val, cur, label, set) => `<div onclick="${set}" style="flex:1;text-align:center;padding:8px;font-size:12px;font-weight:700;cursor:pointer;border-radius:9px;background:${cur === val ? 'var(--navy)' : 'transparent'};color:${cur === val ? '#fff' : 'var(--text3)'}">${label}</div>`;

  const controls = `
    <div style="display:flex;gap:6px;margin-top:14px;background:var(--bg2,#f4f6f9);padding:4px;border-radius:12px">
      ${seg('season', group, 'シーズン', "S.tlGroup='season';render()")}
      ${seg('year', group, '年', "S.tlGroup='year';render()")}
      ${seg('all', group, 'すべて', "S.tlGroup='all';render()")}
    </div>
    <div class="sx" style="margin-top:10px">
      ${TIMELINE_CAT_ORDER.map(cat => { const on = !offCats[cat]; const m = TIMELINE_CATS[cat]; return `<div class="fp ${on ? 'on' : ''}" onclick="toggleTlCat('${cat}')">${m.icon} ${m.label}</div>`; }).join('')}
    </div>
    ${savedSchools.length ? `<select class="sel" style="width:100%;margin-top:10px" onchange="S.tlSchool=this.value;render()">
      <option value="all" ${school === 'all' ? 'selected' : ''}>すべての大学</option>
      ${savedSchools.map(c => `<option value="${c.id}" ${String(school) === String(c.id) ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
    </select>` : ''}`;

  const eventRow = e => `<div onclick="${e.onclick}" style="position:relative;margin-bottom:10px;cursor:pointer">
    <div style="position:absolute;left:-24px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid ${TIMELINE_CATS[e.cat].color};display:flex;align-items:center;justify-content:center;font-size:11px">${e.icon}</div>
    <div class="card" style="padding:11px 13px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;font-size:13px;font-weight:600;line-height:1.4">${escapeHtml(e.title)}</div>
        <div style="font-size:11px;color:var(--text3);white-space:nowrap">${fmtDateJP(e.iso)}</div>
      </div>
      ${e.sub ? `<div style="font-size:12px;color:var(--text3);margin-top:2px">${escapeHtml(e.sub)}</div>` : ''}
    </div>
  </div>`;

  const bodyHtml = groups.length ? groups.map(g => `
    <div style="margin-bottom:8px">
      <div style="position:sticky;top:0;background:var(--bg,#fff);padding:6px 0;z-index:2;font-size:13px;font-weight:800;color:var(--navy)">${escapeHtml(g.label)} <span style="font-size:11px;font-weight:600;color:var(--text3)">${g.events.length}件</span></div>
      <div style="position:relative;padding-left:24px">
        <div style="position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)"></div>
        ${g.events.map(eventRow).join('')}
      </div>
    </div>`).join('')
    : `<div class="card" style="padding:28px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8">表示できる出来事がありません。<br>シーズン・動画・コーチとのやり取り・志望校などを登録すると、ここに歩みが時系列で表示されます。</div>`;

  return `<div class="anim">
    <div style="padding:52px 20px 16px;background:var(--white);border-bottom:1px solid var(--border)">
      <div class="back" onclick="closeSub()">戻る</div>
      <div class="t22" style="margin-top:16px">リクルーティングの歩み</div>
      <div style="font-size:12px;color:var(--text3);margin-top:6px;line-height:1.6">登録済みのデータから自動でまとめた時系列です。各項目をタップすると元の画面に移動します。</div>
      ${controls}
    </div>
    <div style="padding:16px 20px 40px">${bodyHtml}</div>
  </div>`;
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────
async function toggleTask(id) {
  const t = (BAP_STATE.tasks || []).find(x => String(x.id) === String(id));
  if (!t) return;
  const next = t.status === 'done' ? 'open' : 'done';
  t.status = next;            // optimistic
  render();
  try {
    const { error } = await BAP.client.from('tasks').update({ status: next }).eq('id', id);
    if (error) throw error;
  } catch (e) {
    console.error('[BAP] task update failed:', e.message || e);
    t.status = next === 'done' ? 'open' : 'done';  // revert on failure
    render();
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────
// Decide the first screen from the real Supabase session, then keep it in sync.
async function boot() {
  // Paint the branded splash on the FIRST frame, before any await. Everything below
  // (session read, getUser round-trip, player load) happens behind it, so the user
  // never stares at a black screen while the network works.
  S.booting = true;
  try { render(); } catch (e) { /* never let the splash break boot */ }
  try {
    // Public route: a coach opening ?p=<token> gets the standalone recruiting card,
    // no auth and no app shell.
    const ptoken = new URLSearchParams(location.search).get('p');
    if (ptoken) { await renderPublicProfile(ptoken); return; }

    // Password recovery: arriving from a reset email link → show the set-new-password
    // screen and do NOT auto-login. Belt-and-suspenders: hash check + auth event.
    try { if (BAP && BAP.client) BAP.client.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') { S.recovering = true; S.page = 'auth'; S.authView = 'reset'; render(); }
    }); } catch (e) {}
    if ((location.hash || '').indexOf('type=recovery') !== -1) {
      S.booting = false;
      S.recovering = true; S.page = 'auth'; S.authView = 'reset'; render(); return;
    }

    const session = window.BAP ? await BAP.getSession() : null;
    if (window.__mark) window.__mark('session-checked');
    S.booting = false;   // splash stays on screen until the next render() routes us
    if (session) {
      // getSession() only reads local storage. Validate against the server so a stale
      // token for a deleted user can't trap the person in onboarding forever.
      let validUser = true;
      try { const { data: u, error: ue } = await BAP.client.auth.getUser(); if (ue || !(u && u.user)) validUser = false; }
      catch (e) { validUser = false; }
      if (validUser) {
        await enterApp();         // loads the real player; routes to app or onboarding
      } else {
        try { await BAP.signOut(); } catch (e) {}
        S.page = 'auth'; S.authView = 'welcome'; render();
      }
    } else {
      S.page = 'auth'; S.authView = 'welcome'; render();
    }
    if (window.BAP && BAP.onAuthChange) {
      BAP.onAuthChange(function (s) {
        if (!s) {
          // Signed out: clear state and return to auth.
          BAP_STATE.player = null;
          if (S.page === 'app') { S.page = 'auth'; S.authView = 'welcome'; render(); }
        } else if (S.page === 'auth' && !S.recovering) {
          // Session appeared after boot (e.g. Google OAuth redirect completing).
          // Skip while recovering — the user must set a new password first.
          enterApp();
        }
      });
    }
  } catch (e) {
    console.warn('[BAP] boot fell back to auth screen:', e);
    S.booting = false;
    S.page = 'auth'; render();
  }
}

// Premium: a light haptic tick on tappable elements. Fires on pointer-down for
// instant feedback (like a physical button). No-op where unsupported (iOS Safari),
// works on Android web and native wrappers. Throttled so rapid taps feel clean.
(function () {
  if (typeof navigator === 'undefined' || !('vibrate' in navigator)) return;
  let last = 0;
  document.addEventListener('pointerdown', function (e) {
    const el = e.target && e.target.closest && e.target.closest('.btn,.cta-pill,.fp,.ni,.cb,button,[onclick]');
    if (!el) return;
    const now = Date.now(); if (now - last < 45) return; last = now;
    // Varied strength: heavier for navigation, medium for buttons, light for chips/toggles.
    const cl = el.classList;
    const strength = cl.contains('ni') ? 20 : cl.contains('btn') ? 14 : (cl.contains('fp') || cl.contains('cb')) ? 7 : 10;
    try { navigator.vibrate(strength); } catch (_) { /* ignore */ }
  }, true);
})();

boot();
</script>
