// ── Daily Focus notification (best-effort; opt-in) ──────────────────────────
// A single daily reminder. Reliable delivery when the app is closed needs a
// service worker / push backend (not present in this static build), so this is
// best-effort: when the app is open at/after the chosen time and today’s
// reminder hasn’t fired yet, we show one browser notification. Fully opt-in,
// one per day max, user-controlled ON/OFF and time.
function focusNotifPref() {
  try {
    return {
      on: localStorage.getItem('bapFocusNotif') === '1',
      time: localStorage.getItem('bapFocusNotifTime') || '08:00',
    };
  } catch (_) { return { on: false, time: '08:00' }; }
}
// Native Local Notifications plugin (fires even when the app is closed). Present
// only in the native app once @capacitor/local-notifications is installed.
function _localNotif() {
  const Cap = window.Capacitor;
  if (!Cap) return null;
  return (Cap.Plugins && Cap.Plugins.LocalNotifications) ||
         (Cap.registerPlugin && Cap.registerPlugin('LocalNotifications')) || null;
}
const _FOCUS_NOTIF_ID = 4101;
async function setFocusNotif(on, time) {
  try {
    if (time) localStorage.setItem('bapFocusNotifTime', time);
    const t = localStorage.getItem('bapFocusNotifTime') || '08:00';
    const [hh, mm] = t.split(':').map(Number);
    const LN = _localNotif();
    if (on) {
      if (LN && LN.schedule) {
        // Real on-device scheduled notification — delivers while the app is closed.
        let perm = await LN.checkPermissions().catch(() => null);
        if (!perm || perm.display !== 'granted') perm = await LN.requestPermissions().catch(() => null);
        if (!perm || perm.display !== 'granted') {
          alert('通知が許可されませんでした。設定 → BAP → 通知 から許可すると、毎朝フォーカスが届きます。');
          on = false;
        } else {
          try { await LN.cancel({ notifications: [{ id: _FOCUS_NOTIF_ID }] }); } catch (e) {}
          await LN.schedule({ notifications: [{
            id: _FOCUS_NOTIF_ID,
            title: '今日のリクルーティングフォーカス',
            body: '今日のフォーカスをチェックしましょう。',
            schedule: { on: { hour: hh || 8, minute: mm || 0 }, allowWhileIdle: true },
          }] });
        }
      } else if ('Notification' in window && Notification.permission === 'default') {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { alert('通知が許可されませんでした。'); on = false; }
      } else if ('Notification' in window && Notification.permission === 'denied') {
        alert('通知がブロックされています。設定から許可してください。'); on = false;
      }
      localStorage.setItem('bapFocusNotif', on ? '1' : '0');
    } else {
      localStorage.setItem('bapFocusNotif', '0');
      if (LN && LN.cancel) { try { await LN.cancel({ notifications: [{ id: _FOCUS_NOTIF_ID }] }); } catch (e) {} }
    }
  } catch (e) { console.warn('[BAP] setFocusNotif', e); }
  render();
  maybeShowFocusNotif();
}
function _focusTodayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function maybeShowFocusNotif() {
  try {
    const p = focusNotifPref();
    if (!p.on || !('Notification' in window) || Notification.permission !== 'granted') return;
    if (localStorage.getItem('bapFocusNotifShown') === _focusTodayKey()) return; // once per day
    const now = new Date();
    const [hh, mm] = (p.time || '08:00').split(':').map(Number);
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh || 8, mm || 0);
    if (now < target) return; // not yet time today
    const f = todaysFocus();
    new Notification('今日のリクルーティングフォーカス', { body: f.jp });
    localStorage.setItem('bapFocusNotifShown', _focusTodayKey());
  } catch (_) { }
}
// Check when the app becomes visible again (best-effort daily trigger).
try {
  document.addEventListener('visibilitychange', function () { if (!document.hidden) maybeShowFocusNotif(); });
} catch (_) { }

// Metric options come from the metric_definitions catalog (loaded into
// BAP_STATE.metricDefs). metric_key is a FK, so only catalog keys are valid.
function metricDefFor(key) { return (BAP_STATE.metricDefs || []).find(d => d.metric_key === key) || null; }
function metricLabel(key) { const d = metricDefFor(key); return d ? d.label_ja : key; }

// Local (not UTC) YYYY-MM-DD, so "today" matches the user's timezone.
function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

async function addMetric() {
  const f = S.metricForm || {};
  if (!f.metric_key) { alert('指標を選択してください'); return; }
  if (f.value === '' || f.value == null) { alert('数値を入力してください'); return; }
  const def = metricDefFor(f.metric_key);
  const ok = await dbInsert('performance_metrics', {
    metric_key: f.metric_key, value: f.value,
    unit: def ? def.unit : null,
    measured_at: todayLocal(),
  });
  if (ok) S.metricForm = {};
}
async function deleteMetric(id) { await dbDelete('performance_metrics', id); }

// ── Season ↔ video links ─────────────────────────────────────────────────────
function videosForSeason(seasonId) { return (BAP_STATE.videos || []).filter(v => seasonId && String(v.season_id) === String(seasonId)); }
function seasonLabelById(id) { const s = (BAP_STATE.seasons || []).find(x => String(x.id) === String(id)); return s ? s.season_label : ''; }
// The latest season (highest season_seq) that has at least one linked video, and one of its videos.
function latestSeasonVideo() {
  const seasons = playerSeasons(); // ascending
  for (let i = seasons.length - 1; i >= 0; i--) {
    const vids = videosForSeason(seasons[i].id);
    if (vids.length) return { season: seasons[i], video: vids[0], count: vids.length };
  }
  const all = BAP_STATE.videos || [];
  return all.length ? { season: null, video: all[all.length - 1], count: all.length } : null;
}

// RECRUITING ASSISTANT (リクルーティングアシスタント) — read-only decision-support.
// SECURITY: the LLM runs SERVER-SIDE in the `recruiting-assistant` Edge Function.
// The API key never touches the browser. This client only sends the user's OWN
// context + their question (via an authenticated functions.invoke that carries the
// Supabase JWT), and renders the reply through escapeHtml. It cannot take actions.
// ══════════════════════════════════════════════════════════════════════════
const ASSISTANT_SUGGESTIONS = [
  '保存した大学の中で、私の優先順位に合うのはどこ？',
  '今、何を優先して伸ばすべき？',
  '志望校を2校、比較して',
  'リクルーティングの進め方を教えて',
];

// Compact, user-scoped context. Reuses existing builders; sends only the athlete's
// OWN data (no other users' data is ever accessible — the same as what they can see).
function assistantContext() {
  const ctx = {};
  try {
    const r = (typeof buildRecruitingResume === 'function') ? buildRecruitingResume() : null;
    if (r && r.player) {
      ctx.player = { grad_year: r.player.grad_year, primary_pos: r.player.primary_pos,
        secondary_pos: r.player.secondary_pos, height_cm: r.player.height_cm, weight_kg: r.player.weight_kg,
        throws: r.player.throws, bats: r.player.bats };
      ctx.academics = r.academics || null;
      if (r.athletic) ctx.athletic = { division: r.athletic.division, score: r.athletic.score, role: r.athletic.role };
      ctx.schools = ((r.recruiting && r.recruiting.schools) || []).slice(0, 40)
        .map(s => ({ name: s.name, division: s.division, decision: s.decision }));
    }
  } catch (e) {}
  try {
    const fit = (typeof buildRecruitingFitProfile === 'function') ? buildRecruitingFitProfile() : null;
    if (fit) ctx.fit = fit;
  } catch (e) {}
  return ctx;
}

async function assistantSend(preset) {
  if (!S.assistant) S.assistant = { messages: [], input: '', loading: false };
  const text = String(preset != null ? preset : (S.assistant.input || '')).trim();
  if (!text || S.assistant.loading) return;
  S.assistant.messages.push({ role: 'user', content: text });
  S.assistant.input = '';
  S.assistant.loading = true;
  render();
  const toBottom = () => { const el = scr(); if (el) el.scrollTop = el.scrollHeight; };
  setTimeout(toBottom, 20);
  try {
    if (!window.BAP || !BAP.client || !BAP.client.functions) throw new Error('unconfigured');
    const { data, error } = await BAP.client.functions.invoke('recruiting-assistant', {
      body: { messages: S.assistant.messages.slice(-12), context: assistantContext(), lang: 'ja' }
    });
    if (error) throw error;
    const reply = (data && (data.reply || data.message)) || '応答を取得できませんでした。';
    let content = String(reply);
    if (data && data.detail) content += `\n\n（診断: ${data.detail}）`;   // setup aid; remove server-side once working
    S.assistant.messages.push({ role: 'assistant', content, error: !!(data && data.detail) });
  } catch (e) {
    const d = (e && (e.message || e.name)) ? `\n\n（診断: ${e.message || e.name}）` : '';
    S.assistant.messages.push({ role: 'assistant', error: true,
      content: 'エラーが発生しました。時間をおいて再度お試しください。（この機能はサーバー側の設定が必要です）' + d });
  }
  S.assistant.loading = false;
  render();
  setTimeout(toBottom, 20);
}

// ════════════════════════════════════════════════════════════════════════════
// SCHOOL INTELLIGENCE — mini recruiting dashboard per school.
// PRESENTATION LAYER ONLY: combines pieces that already exist (computeMatch for
// fit, the coach CRM for contact + shared documents, the Decision funnel, seasons/
// videos). It introduces NO new scoring and fabricates nothing — missing data shows
// 情報不足 / 未共有 / 予定なし. All facts are derived, never invented.
// ════════════════════════════════════════════════════════════════════════════

// Aggregate this school's coach activity from the existing coach CRM data.
function schoolCoachActivity(c) {
  const coaches = collegeContacts(c.id);
  let last = null, lastCoach = '', anyOut = false, anyIn = false, visited = false;
  let newest = null; const sharedSet = {}; const openFu = [];
  coaches.forEach(cc => {
    const sh = cc.shared || {}; Object.keys(sh).forEach(k => { if (sh[k]) sharedSet[k] = true; });
    (BAP_STATE.messagesByContact[String(cc.id)] || []).forEach(m => {
      const k = interactionKind(m), meta = INTERACTION_META[k] || {}, ts = m.sent_at || m.created_at;
      if (ts && (!last || ts > last)) { last = ts; lastCoach = cc.coach_name || ''; }
      if (ts && (!newest || ts > newest.ts)) newest = { ts, k };
      if (['email_out', 'call', 'text'].includes(k)) anyOut = true;
      if (meta.inbound) anyIn = true;
      if (['visit', 'camp', 'showcase'].includes(k)) visited = true;
      if (m.follow_up_at && !m.follow_up_done) openFu.push(m.follow_up_at);
    });
  });
  openFu.sort();
  const waiting = !!newest && ['email_out', 'call', 'text'].includes(newest.k) && !(INTERACTION_META[newest.k] || {}).inbound;
  return { coaches, lastContact: last, lastCoach, anyOut, anyIn, visited, videoShared: !!sharedSet.video, sharedSet, nextFollowUp: openFu[0] || null, waiting };
}

// The recruiting funnel, derived from real data (saved date, interactions, decision).
function schoolFunnelStages(c) {
  const savedRow = savedRowFor(c.id);
  const act = schoolCoachActivity(c);
  const di = DECISION_ORDER.indexOf(decisionCode(savedRow && savedRow.decision_status));
  const atLeast = code => di >= 0 && di >= DECISION_ORDER.indexOf(code);
  return [
    { key: 'saved', label: '保存', done: !!savedRow },
    { key: 'contact', label: 'コーチ連絡', done: act.anyOut || atLeast('contacting') },
    { key: 'reply', label: '返信', done: act.anyIn || atLeast('conversation') },
    { key: 'video', label: '動画共有', done: act.videoShared },
    { key: 'visit', label: '訪問', done: act.visited },
    { key: 'apply', label: '出願', done: atLeast('applying') },
    { key: 'offer', label: 'オファー', done: atLeast('offer') },
    { key: 'decision', label: '決定', done: atLeast('committed') },
  ];
}

// ══════════════════════════════════════════════════════════════════════════
// ACTION PRIORITY CONTRACT — the single, EXPLICIT ordering for next-action rules.
// Rules are grouped into named tiers evaluated top-to-bottom; the first matching
// rule wins. A new rule MUST declare a tier, so it can never silently jump the
// queue or create a competing heuristic. This is the structural guard against
// rule-explosion drift. No score, no AI, no ranking — a fixed contract only.
//   terminal       — end states; stop suggesting work
//   blocking       — cannot progress until resolved
//   time_sensitive — decays with time; act now
//   momentum       — build / continue the relationship
//   advancement    — move the stage forward
//   steady         — nothing pressing; keep in touch
// Each action also carries a factual `context` tag (situational grounding, e.g.
// 返信待ち8日) — NOT a score, just "why this matters right now".
// ══════════════════════════════════════════════════════════════════════════
const ACTION_TIERS = ['terminal', 'blocking', 'time_sensitive', 'momentum', 'advancement', 'steady'];

function _schoolActionCtx(c) {
  const act = schoolCoachActivity(c);
  const coaches = act.coaches;
  return {
    c, act, coaches,
    stage: schoolStage(savedRowFor(c.id)),
    firstId: coaches.length ? coaches[0].id : null,
    escName: escapeJs(c.name),
    videos: (BAP_STATE.videos || []).length,
    daysSince: act.lastContact ? _daysAgo(act.lastContact) : null,
    followDue: (() => { if (!act.nextFollowUp) return false; const d = daysUntil(act.nextFollowUp); return d != null && d <= 0; })(),
  };
}

// { tier, when(x)->bool, action(x)->{label, why, context, act, tone} }.
const SCHOOL_ACTION_RULES = [
  { tier: 'terminal', when: x => x.stage === 'committed', action: x => ({ label: '進学が決まりました', why: 'この大学のリクルーティングは完了です。', context: '進学決定済み', tone: 'done' }) },
  { tier: 'terminal', when: x => x.stage === 'closed', action: x => ({ label: '終了した大学です', why: '必要なら段階を戻して再開できます。', context: '終了', tone: 'muted' }) },
  { tier: 'blocking', when: x => !x.coaches.length, action: x => ({ label: 'コーチを追加する', why: 'この大学のコーチがまだ登録されていません。', context: 'コーチ未登録', act: `openAddContactForCollege('${x.c.id}','${x.escName}')`, tone: 'todo' }) },
  { tier: 'time_sensitive', when: x => x.followDue, action: x => ({ label: '予定したフォローアップを送る', why: 'フォローアップの予定日を過ぎています。', context: 'フォローアップ期限超過', act: `openTemplates('${x.firstId}','followup')`, tone: 'warn' }) },
  { tier: 'time_sensitive', when: x => x.act.waiting && x.daysSince != null && x.daysSince >= 7, action: x => ({ label: 'フォローアップを送る', why: `返信待ちが${x.daysSince}日続いています。`, context: `返信待ち${x.daysSince}日`, act: `openTemplates('${x.firstId}','followup')`, tone: 'warn' }) },
  { tier: 'momentum', when: x => !x.act.anyOut && !x.act.anyIn && !x.act.visited, action: x => ({ label: '初回メールを送る', why: 'コーチはいますが、まだ連絡していません。', context: '未接触', act: `openTemplates('${x.firstId}','intro')`, tone: 'todo' }) },
  { tier: 'momentum', when: x => x.videos === 0, action: x => ({ label: 'ハイライト動画を用意する', why: 'コーチが最初に見る資料です。', context: '動画なし', act: 'openVideos()', tone: 'todo' }) },
  { tier: 'momentum', when: x => !x.act.videoShared, action: x => ({ label: 'ハイライト動画を共有する', why: 'このコーチにまだ動画を共有していません。', context: '動画未共有のまま接触済み', act: `openTemplates('${x.firstId}','video')`, tone: 'todo' }) },
  { tier: 'momentum', when: x => x.act.visited, action: x => ({ label: 'お礼と次の連絡を送る', why: '訪問・イベントの記録があります。', context: '訪問済み', act: `openTemplates('${x.firstId}','camp_thanks')`, tone: 'good' }) },
  { tier: 'advancement', when: x => x.stage === 'offer', action: x => ({ label: '他校と比較して意思を固める', why: 'オファーがあります。条件を比べて決めましょう。', context: 'オファー後・未決定', act: "closeSub();S.collegeView='saved';go('colleges')", tone: 'good' }) },
  { tier: 'advancement', when: x => x.stage === 'applying', action: x => ({ label: '出願書類を確認する', why: '出願中です。必要書類を揃えましょう。', context: '出願中', act: `openHub('${x.c.id}','plan')`, tone: 'todo' }) },
  { tier: 'steady', when: x => true, action: x => ({ label: 'やり取りを続ける', why: '順調です。定期的に近況を共有しましょう。', context: '順調', act: x.firstId ? `openSub('contact','${x.firstId}')` : '', tone: 'info' }) },
];

// Deterministic "next action" for a school — one primary CTA, chosen strictly by
// the Action Priority Contract above.
function schoolNextAction(c) {
  if (!c) return null;
  const x = _schoolActionCtx(c);
  for (const tier of ACTION_TIERS) {
    for (const r of SCHOOL_ACTION_RULES) {
      if (r.tier === tier && r.when(x)) return r.action(x);
    }
  }
  return null;
}
function _nextActionColor(tone) { return tone === 'warn' ? 'var(--amber)' : tone === 'done' ? 'var(--green)' : tone === 'muted' ? 'var(--text3)' : 'var(--navy)'; }

// Deterministic per-coach next action (relationship-level), same idea.
function coachNextAction(contact) {
  if (!contact) return null;
  const health = coachCommHealth(contact);
  const msgs = interactionsFor(contact.id);
  const shared = contact.shared || {};
  if (!msgs.length) return { label: '初回メールを送る', context: '未接触', act: `openTemplates('${contact.id}','intro')`, tone: 'todo' };
  if (health.nextFollowUp) { const d = daysUntil(health.nextFollowUp); if (d != null && d <= 0) return { label: '予定したフォローアップを送る', context: 'フォローアップ期限超過', act: `openTemplates('${contact.id}','followup')`, tone: 'warn' }; }
  if (health.waiting && health.daysSince != null && health.daysSince >= 7) return { label: 'フォローアップを送る', context: `返信待ち${health.daysSince}日`, act: `openTemplates('${contact.id}','followup')`, tone: 'warn' };
  if (!shared.video) return { label: 'ハイライト動画を共有する', context: '動画未共有', act: `openTemplates('${contact.id}','video')`, tone: 'todo' };
  return { label: '近況をアップデートする', context: '順調', act: `openTemplates('${contact.id}','academic')`, tone: 'info' };
}

// The dashboard summary card shown at the top of a school's page.
function hubDashboardCard(c) {
  const savedRow = savedRowFor(c.id);
  const act = schoolCoachActivity(c);
  const dc = decisionCode(savedRow && savedRow.decision_status);
  const statusLabel = (dc && DECISION_STATUS[dc]) ? DECISION_STATUS[dc].label : (act.anyOut ? '連絡中' : savedRow ? '保存' : '未保存');
  const statusBadge = (dc && DECISION_STATUS[dc]) ? DECISION_STATUS[dc].badge : (act.anyOut ? 'b-blue' : 'b-gray');
  const mt = (typeof computeMatch === 'function') ? computeMatch(c) : {};
  const bf = mt.athletic, af = mt.academic;
  const level = fitLevelFromMatch(bf, af);
  const fitMeta = level ? FIT_LEVEL_META[level] : null;
  const stages = schoolFunnelStages(c);
  const sharedKeys = SHARED_ASSETS.filter(([k]) => act.sharedSet[k]);
  const missingKeys = SHARED_ASSETS.filter(([k]) => !act.sharedSet[k]);
  const seasonVids = playerSeasons().filter(s => videosForSeason(s.id).length).map(s => s.season_label);
  const applied = DECISION_ORDER.indexOf(dc) >= DECISION_ORDER.indexOf('applying') && DECISION_ORDER.indexOf(dc) >= 0;

  // Horizontal funnel stepper (reached = navy, pending = gray).
  const funnel = `<div style="display:flex;overflow-x:auto;gap:0;padding:4px 0 2px">
    ${stages.map((s, i) => `<div style="display:flex;align-items:center;flex-shrink:0">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px">
        <div style="width:14px;height:14px;border-radius:50%;background:${s.done ? 'var(--navy)' : '#fff'};border:2px solid ${s.done ? 'var(--navy)' : 'var(--border-md)'}"></div>
        <div style="font-size:10px;font-weight:600;color:${s.done ? 'var(--navy)' : 'var(--text3)'};text-align:center;white-space:nowrap">${s.label}</div>
      </div>
      ${i < stages.length - 1 ? `<div style="width:22px;height:2px;background:${stages[i + 1].done ? 'var(--navy)' : 'var(--border)'};margin-bottom:16px"></div>` : ''}
    </div>`).join('')}
  </div>`;

  const chipRow = (arr, on) => arr.length ? arr.map(([k, l]) => `<span style="font-size:12px;font-weight:600;border-radius:99px;padding:5px 10px;border:1.5px solid ${on ? 'var(--green)' : 'var(--border-md)'};background:${on ? 'var(--green-bg,#e8f5ec)' : '#fff'};color:${on ? 'var(--green)' : 'var(--text3)'}">${on ? '✓ ' : ''}${l}</span>`).join('') : `<span style="font-size:12px;color:var(--text3)">${on ? '未共有' : 'なし'}</span>`;

  const na = schoolNextAction(c);
  const naCol = na ? _nextActionColor(na.tone) : 'var(--navy)';
  const ctxBg = naCol === 'var(--amber)' ? 'var(--amber-bg)' : naCol === 'var(--green)' ? 'var(--green-bg,#e8f5ec)' : 'var(--blue-soft,#eef4fb)';
  const bl = schoolBlockers(c);
  const open = !!S.hubDetail;
  const fitCol = v => v != null ? 'var(--navy)' : 'var(--text3)';

  // LEVEL 1 — HERO: the single dominant element (elevated, tone accent, large).
  const hero = na ? `<div style="background:#fff;border-radius:16px;box-shadow:0 3px 16px rgba(16,32,64,0.10);border-left:4px solid ${naCol};padding:16px 18px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.6px;color:var(--text3)">次のアクション</span>
      ${na.context ? `<span style="font-size:10px;font-weight:700;color:${naCol};background:${ctxBg};border-radius:99px;padding:2px 9px">${na.context}</span>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:800;line-height:1.3;color:var(--text)">${na.label}</div>
        ${na.why ? `<div style="font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5">${na.why}</div>` : ''}
      </div>
      ${na.act ? `<button style="border:none;background:var(--navy-bg);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:12px;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="${na.act}">実行</button>` : ''}
    </div>
  </div>` : '';

  // LEVEL 2 — supporting truth: one flat, tinted strip (secondary weight).
  const strip = `<div style="background:var(--bg2,#f6f8fb);border-radius:14px;padding:14px 16px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span class="badge ${statusBadge}">${statusLabel}</span>
      <span style="font-size:11px;color:var(--text3)">${act.lastContact ? `最終連絡 ${_daysAgo(act.lastContact)}日前${act.lastCoach ? ' · ' + act.lastCoach : ''}` : '連絡記録なし'}</span>
    </div>
    ${mt.infoShort ? '' : `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:flex-end;gap:9px">
        <div style="font-size:44px;font-weight:800;color:${mt.band.color};line-height:0.86;letter-spacing:-1.5px">${mt.score}<span style="font-size:20px;font-weight:700;letter-spacing:0">%</span></div>
        <div style="font-size:9.5px;font-weight:700;letter-spacing:2px;color:var(--text3);padding-bottom:7px">マッチング率</div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;margin-top:10px">
        <span style="width:8px;height:8px;border-radius:50%;background:${mt.band.color};display:inline-block"></span>
        <span style="font-size:14px;font-weight:800;color:${mt.band.color}">${mt.band.label}</span>
      </div>
      ${mt.reason ? `<div style="font-size:12px;color:var(--text2);line-height:1.65;margin-top:8px">${mt.reason}</div>` : ''}
    </div>`}
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div><div style="font-size:11px;color:var(--text3)">野球フィット</div><div style="font-size:16px;font-weight:800;color:${fitCol(bf)}">${bf != null ? bf + '%' : '—'}</div></div>
      <div><div style="font-size:11px;color:var(--text3)">学業フィット</div><div style="font-size:16px;font-weight:800;color:${fitCol(af)}">${af != null ? af + '%' : '—'}</div></div>
      <div><div style="font-size:11px;color:var(--text3)">コーチ関心</div><div style="font-size:16px;font-weight:800;color:${fitCol(mt.coach)}">${mt.coach != null ? mt.coach + '%' : '—'}</div></div>
      ${mt.preferences != null ? `<div><div style="font-size:11px;color:var(--text3)">希望条件</div><div style="font-size:16px;font-weight:800;color:${fitCol(mt.preferences)}">${mt.preferences}%</div></div>` : ''}
    </div>
    ${(bf == null || mt.lowConf) ? `<div style="font-size:10px;color:var(--text3);margin-top:8px;line-height:1.5">${bf == null ? '競技指標が未登録のため、野球フィットは表示できません。' : '一部の指標が未登録のため、参考値です。'}</div>` : ''}
  </div>`;

  // LEVEL 2b — funnel: light, secondary.
  const funnelSec = `<div style="margin-bottom:4px"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">リクルーティング段階</div>${funnel}</div>`;

  // LEVEL 4 — diagnostics: collapsed by default (nothing here is a primary CTA).
  const facts = [['返信待ち', act.waiting ? 'あり' : 'なし'], ['次のフォローアップ', act.nextFollowUp ? fmtDateJP(act.nextFollowUp) : '未設定'], ['出願', applied ? '出願済み / 出願中' : '未着手'], ['訪問', act.visited ? '記録あり' : '予定なし']];
  const detail = `
    ${bl.length ? `<div style="font-size:11px;color:var(--text3);margin-bottom:6px">進行を妨げている要因</div>${bl.slice(0, 3).map(b => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--text2)"><span style="width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0"></span><span>${b.short || b.label}</span></div>`).join('')}<div style="height:12px"></div>` : ''}
    <div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:12px">${facts.map(([l, v]) => `<div><span style="font-size:11px;color:var(--text3)">${l}</span> <span style="font-size:13px;font-weight:600">${v}</span></div>`).join('')}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">共有した資料</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${chipRow(sharedKeys, true)}</div>
    ${missingKeys.length ? `<div style="font-size:11px;color:var(--text3);margin-bottom:6px">未共有</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${chipRow(missingKeys, false)}</div>` : ''}
    ${seasonVids.length ? `<div style="font-size:11px;color:var(--text3);margin:8px 0 4px">シーズン動画</div><div style="font-size:13px;color:var(--text2);line-height:1.6">${seasonVids.map(v => escapeHtml(v)).join(' ・ ')}</div>` : ''}`;
  const detailToggle = `<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">
    <div onclick="S.hubDetail=${open ? 'false' : 'true'};render()" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
      <span style="font-size:12px;font-weight:600;color:var(--text2)">詳細${bl.length ? ` · 要対応 ${bl.length}` : ''}</span>
      <span style="font-size:15px;color:var(--text3);display:inline-block;transform:rotate(${open ? '90' : '0'}deg);transition:.15s">›</span>
    </div>
    ${open ? `<div style="margin-top:12px">${detail}</div>` : ''}
  </div>`;

  return `<div style="padding:20px 20px 0">
    ${hero}
    ${strip}
    ${funnelSec}
    ${detailToggle}
  </div>`;
}

// Campus setting (City/Town/Suburban/Rural) -> Japanese.
function campusJp(v) {
  const m = { city: '都会', urban: '都会', town: '町', suburban: '郊外', rural: '田舎' };
  return v ? (m[String(v).trim().toLowerCase()] || v) : '—';
}
function renderCollegeDetail() {
  const c = findCollege(S.subData);
  if (!c) return '';
  const saved = (BAP_STATE.saved || []).some(s => String(s.college_id) === String(c.id));
  const tab = S.hubTab || 'overview';
  const tabs = [['overview','概要'],['plan','プラン'],['coaches','コーチ'],['decision','段階']];

  const body = tab === 'plan' ? hubPlanTab(c) : tab === 'coaches' ? hubCoachesTab(c) : tab === 'decision' ? hubDecisionTab(c, saved) : hubOverviewTab(c, saved);

  const _hubId = schoolIdentity(c);
  return `<div class="anim">
    <div style="padding:52px 20px 0;background:var(--white);position:relative">
      <!-- School-identity band: a soft, cropped color band from the school's identity
           color (official where known). Low-opacity so it anchors the place without
           competing with the Next Action content below. -->

      <div class="back" onclick="closeSub()" style="position:relative">大学リスト</div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:14px;position:relative">
        ${schoolAvatar(c, 56)}
        <div style="min-width:0">
          <div class="t18" style="margin-bottom:4px">${c.name}</div>
          <div style="font-size:13px;color:var(--text3)">${[c.division, [c.city, c.state].filter(Boolean).join(', '), c.conference].filter(Boolean).join(' · ')}</div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="badge b-navy">${c.division || '—'}</span>
            ${c.intl_friendly ? '<span class="badge b-blue">国際生受け入れ</span>' : ''}
            ${(() => { const sr = savedRowFor(c.id); const m = sr && DECISION_STATUS[decisionCode(sr.decision_status)]; return m ? `<span class="badge ${m.badge}">${m.label}</span>` : (saved ? '<span class="badge b-green">保存済み</span>' : ''); })()}
          </div>
        </div>
      </div>
      <div style="display:flex;margin-top:16px;overflow-x:auto">
        ${tabs.map(([k,l])=>`<div onclick="S.hubTab='${k}';render()" style="padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;color:${tab===k?'var(--navy)':'var(--text3)'};border-bottom:2px solid ${tab===k?'var(--navy)':'transparent'}">${l}</div>`).join('')}
      </div>
    </div>
    <div style="border-top:1px solid var(--border)"></div>
    ${body}
  </div>`;
}

// Tab 1: 概要 — raw school facts + why saved. No scoring, no progress (that lives in プラン).
function hubOverviewTab(c, saved) {
  const savedRow = (BAP_STATE.saved || []).find(s => String(s.college_id) === String(c.id));
  const money = v => v == null ? '—' : '$' + Number(v).toLocaleString('en-US');
  const pctv = v => v == null ? '—' : Number(v) + '%';
  const facts = [
    ['区分', c.type || '—'],
    ['コンファレンス', c.conference || '—'],
    ['所在地', [c.city, c.state].filter(Boolean).join(', ') || '—'],
    ['キャンパス', campusJp(c.campus_setting)],
    ['学費 / 年（州外）', fmtTuition(c.tuition)],
    ['学費 / 年（州内）', c.tuition_in_state != null ? fmtTuition(c.tuition_in_state) : '—'],
    ['奨学金適用後の平均的な負担額', money(c.net_cost)],
    ['寮費（年間）', (function () {
      const v = roomBoardVal(c);
      if (v != null) return money(v);
      // TEMP diagnostic — tells us why it's missing:
      if (!('room_board' in c)) return '— [データに room_board 列が来ていません]';   // fetch/cache issue
      if (c.room_board == null || c.room_board === '') return '—';                    // empty for this school
      return '— [生の値: ' + c.room_board + ']';                                       // value my parser rejected
    })()],
    ['奨学金', c.scholarship == null ? '—' : (c.scholarship ? 'あり' : 'なし（D3は競技奨学金なし）')],
    ['入学者数', c.enrollment != null ? Number(c.enrollment).toLocaleString('en-US') + '名' : '—'],
    ['合格率', pctv(c.acceptance_rate)],
    ['卒業率', pctv(c.graduation_rate)],
    ['在籍継続率', pctv(c.retention_rate)],
    ['部員数', c.roster_size != null ? (c.roster_size + '名前後') : '—'],
  ];
  return `
    <!-- Recruiting dashboard summary (School Intelligence) -->
    ${saved ? hubDashboardCard(c) : ''}

    <!-- Save reason -->
    <div style="padding:20px 20px 0">
      <div class="card" style="padding:16px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.5px;margin-bottom:4px">この大学を保存した理由</div>
        <div style="font-size:13px;color:${savedRow && savedRow.notes ? 'var(--text)' : 'var(--text3)'};line-height:1.7">${savedRow && savedRow.notes ? escapeHtml(savedRow.notes) : (saved ? 'メモは未入力です（保存した大学のメモ欄から追加できます）' : 'まだ保存していません。下のボタンから保存できます。')}</div>
      </div>
    </div>

    <!-- Latest-season video to share with this coach (deterministic: newest season with a video) -->
    ${(() => {
      const lv = latestSeasonVideo();
      if (!lv) return '';
      const v = lv.video;
      const link = v.storage_path && /^https?:\/\//.test(v.storage_path) ? v.storage_path : '';
      const sub = [lv.season ? lv.season.season_label : 'シーズン未指定', videoKindJp(v.kind)].filter(Boolean).join(' · ');
      return `<div class="sec" style="margin-top:20px">
        <div class="t11" style="margin-bottom:10px">コーチに共有する動画（最新シーズン）</div>
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:10px;background:var(--bg2,#f4f6f9);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🎥</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.title || videoKindJp(v.kind) || 'ハイライト動画'}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">${sub}${lv.count > 1 ? ` · 他${lv.count - 1}本` : ''}</div>
          </div>
          ${link ? `<a href="${safeHref(link)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--blue);font-weight:700;flex-shrink:0;text-decoration:none">開く ›</a>` : ''}
        </div>
      </div>`;
    })()}

    <!-- Key facts -->
    <div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">基本情報</div>
      <div class="card" style="padding:0 16px">
        ${facts.map(([l,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:14px;color:var(--text2)">${l}</div>
          <div style="font-size:14px;font-weight:600;text-align:right">${v}</div>
        </div>`).join('')}
        <div style="padding:4px 0"></div>
      </div>
    </div>

    <!-- Contact & links (real data; rows hidden when absent) -->
    ${(c.head_coach || c.phone || c.address || c.website || c.athletic_website) ? `<div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">連絡先・リンク</div>
      <div class="card" style="padding:0 16px">
        ${[
          c.head_coach ? ['ヘッドコーチ', c.head_coach] : null,
          c.phone ? ['電話', `<a href="tel:${(c.phone||'').replace(/[^0-9+]/g,'')}" style="color:var(--blue)">${c.phone}</a>`] : null,
          c.address ? ['住所', c.address] : null,
          c.website ? ['大学サイト', `<a href="${safeHref(c.website)}" target="_blank" rel="noopener" style="color:var(--blue)">開く ›</a>`] : null,
          c.athletic_website ? ['競技サイト', `<a href="${safeHref(c.athletic_website)}" target="_blank" rel="noopener" style="color:var(--blue)">開く ›</a>`] : null,
        ].filter(Boolean).map(([l,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:14px;color:var(--text2);flex-shrink:0">${l}</div>
          <div style="font-size:14px;font-weight:600;text-align:right;min-width:0;word-break:break-word">${v}</div>
        </div>`).join('')}
        <div style="padding:4px 0"></div>
      </div>
    </div>` : ''}

    <!-- Save action -->
    <div style="padding:24px 20px 32px;display:flex;flex-direction:column;gap:10px">
      ${saved
        ? `<button class="btn btn-border" onclick="closeSub();S.collegeView='saved';render()">保存した大学を見る</button>`
        : `<button class="btn btn-navy" onclick="saveCollege('${c.id}')">この大学を保存する</button>`}
    </div>`;
}

// Tab 2: リクルーティングプラン — the operational center for THIS school.
// Answers: where do we stand, what's blocking us, what's the next action.
// 100% real Supabase data. No AI, no scores, no fabricated logic.
function hubPlanTab(c) {
  const p = BAP_STATE.player || {};
  const esc = escapeJs;
  const has = v => v != null && String(v).trim() !== '';
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const gpa = parseFloat(p.gpa), minGpa = parseFloat(c.min_gpa);
  const toefl = hasNum(p.toefl);
  const videos = (BAP_STATE.videos || []).length;
  const coaches = collegeContacts(c.id);
  const coachIds = coaches.map(x => String(x.id));
  const msgs = coachIds.flatMap(id => BAP_STATE.messagesByContact[id] || []);
  const anyOutbound = msgs.some(m => m.direction === 'outbound');
  const anyInbound = msgs.some(m => m.direction === 'inbound');
  const schoolTasks = (BAP_STATE.tasks || []).filter(t => (t.text || '').includes(c.name));
  const savedRow = (BAP_STATE.saved || []).find(s => String(s.college_id) === String(c.id));
  const stripName = t => (t || '').replace(`[${c.name}] `, '');

  // ── 1. Current blockers (shared model → same as Strategy & Home) ────────────
  const allBlockers = schoolBlockers(c);
  const topBlockers = allBlockers.slice(0, 3);

  const blockerCard = `
    <div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">この大学で現在止まっていること</div>
      ${topBlockers.length ? `<div class="card" style="padding:2px 16px">
        ${topBlockers.map((b, i) => `<div style="display:flex;align-items:center;gap:12px;padding:14px 0;${i < topBlockers.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0"></span>
          <div style="flex:1;font-size:14px;color:var(--text);font-weight:500;line-height:1.5">${b.label}</div>
          <button style="border:none;background:var(--navy-bg);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap" onclick="${b.run}">${b.btn}</button>
        </div>`).join('')}
      </div>` : `<div class="card" style="padding:16px;font-size:14px;color:var(--green);font-weight:600">現在、大きな障害はありません。</div>`}
    </div>`;

  // ── 1b. Cross-school awareness — global blockers that also hit other schools ─
  const XImpact = crossSchoolImpact().impact;
  const globalHere = allBlockers.filter(b => b.scope === 'global');
  const XLABEL = { video: 'ハイライト動画', toefl: 'TOEFL', gpa: 'GPA' };
  const xRows = globalHere.map(b => {
    const others = (XImpact[b.type] || []).filter(x => String(x.id) !== String(c.id)).length;
    return { type: b.type, name: XLABEL[b.type] || b.type, others };
  }).filter(r => r.others > 0);
  const crossCard = xRows.length ? `
    <div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">他の志望校にも影響する項目</div>
      <div class="card" style="padding:2px 16px">
        ${xRows.map((r, i) => `<div style="display:flex;align-items:center;gap:12px;padding:13px 0;${i < xRows.length - 1 ? 'border-bottom:1px solid var(--border)' : ''};cursor:pointer" onclick="S.strategyFocus='${r.type}';openSub('strategy')">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">${r.name}</div>
            <div style="font-size:12px;color:var(--blue);font-weight:600;margin-top:2px">他 ${r.others}校にも影響します</div>
          </div>
          <span style="font-size:12px;color:var(--blue);font-weight:600;white-space:nowrap">まとめて対応 ›</span>
        </div>`).join('')}
      </div>
    </div>` : '';

  // ── 2. Recruiting timeline sections (完了 / 進行中 / 未着手) ──────────────────
  const profFields = [p.name, p.school, p.grad_year, p.position, p.height_cm, p.weight_kg];
  const profDone = profFields.filter(has).length;
  const profStatus = profDone === profFields.length ? '完了' : profDone === 0 ? '未着手' : '進行中';

  const gpaOk = hasNum(gpa) && (!hasNum(minGpa) || gpa >= minGpa);
  const acadStatus = (gpaOk && toefl) ? '完了' : (!hasNum(gpa) && !toefl) ? '未着手' : '進行中';

  const vidStatus = videos > 0 ? '完了' : '未着手';
  const coachStatus = anyOutbound ? '完了' : coaches.length ? '進行中' : '未着手';

  const stageCode = schoolStage(savedRow);
  const stageIdx = DECISION_ORDER.indexOf(stageCode);
  const appStatus = stageIdx >= DECISION_ORDER.indexOf('applying') && stageIdx >= 0 && stageCode !== 'closed' ? '完了'
    : (stageCode === 'contacting' || stageCode === 'conversation') ? '進行中'
    : '未着手';

  const sections = [
    { label: 'プロフィール', status: profStatus,
      detail: profStatus === '完了' ? '基本情報は登録済みです' : `基本情報 ${profDone}/${profFields.length} 項目 登録済み`,
      btn: 'プロフィールを編集', act: 'openProfileEdit()' },
    { label: '学力', status: acadStatus,
      detail: [hasNum(gpa) ? `GPA ${gpa}` : 'GPA未登録', toefl ? `TOEFL ${p.toefl}` : 'TOEFL未登録', hasNum(minGpa) ? `この大学の要件 ${minGpa}` : ''].filter(Boolean).join(' · '),
      btn: '登録する', act: 'openProfileEdit()' },
    { label: '動画', status: vidStatus,
      detail: videos > 0 ? `ハイライト動画 ${videos}本 登録済み` : 'ハイライト動画がありません',
      btn: '動画を追加', act: 'openVideos()' },
    { label: 'コーチ連絡', status: coachStatus,
      detail: !coaches.length ? 'この大学のコーチ未登録' : anyOutbound ? `メール送信済み（コーチ${coaches.length}名）` : `コーチ${coaches.length}名 登録済み・メール未送信`,
      btn: !coaches.length ? 'コーチを追加' : anyOutbound ? 'メッセージを見る' : 'メールを作成',
      act: !coaches.length ? `openAddContactForCollege('${c.id}','${esc(c.name)}')` : anyOutbound ? `openSub('contact','${coaches[0].id}')` : `openSub('emailAsst','${coaches[0].id}')` },
    { label: '出願', status: appStatus,
      detail: stageCode ? `リクルーティング段階: ${(DECISION_STATUS[stageCode] || {}).label || stageCode}` : '段階が未設定です',
      btn: '段階を更新', act: `openHub('${c.id}','decision')` },
  ];

  const chip = s => `<span class="badge ${s === '完了' ? 'b-green' : s === '進行中' ? 'b-amber' : 'b-gray'}">${s}</span>`;

  const timelineCard = `
    <div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">リクルーティングの進捗</div>
      <div class="card" style="padding:2px 16px">
        ${sections.map((s, i) => `<div style="padding:14px 0;${i < sections.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1;font-size:14px;font-weight:600">${s.label}</div>
            ${chip(s.status)}
          </div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5">${s.detail}</div>
          ${s.status !== '完了' ? `<button style="margin-top:10px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer" onclick="${s.act}">${s.btn}</button>` : ''}
        </div>`).join('')}
      </div>
    </div>`;

  // ── 3. This-school tasks (actionable open items) ────────────────────────────
  const tasksCard = `
    <div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">この大学のタスク</div>
      ${schoolTasks.length ? `<div class="card" style="padding:0 16px">
        ${schoolTasks.map((t, i) => { const done = t.status === 'done'; return `<div style="display:flex;align-items:center;gap:10px;padding:13px 0;${i < schoolTasks.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
          <div class="cb ${done ? 'on' : ''}" style="cursor:pointer" onclick="toggleTask('${t.id}')"></div>
          <div style="flex:1;font-size:14px;cursor:pointer;color:${done ? 'var(--text3)' : 'var(--text)'};text-decoration:${done ? 'line-through' : 'none'}" onclick="toggleTask('${t.id}')">${stripName(t.text)}</div>
          <div style="color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px" onclick="event.stopPropagation();deleteTask('${t.id}')">×</div>
        </div>`; }).join('')}
      </div>` : ''}
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="planTaskInput" class="inp" style="flex:1" placeholder="この大学向けのタスクを追加..."/>
        <button class="btn btn-navy" style="width:auto;padding:13px 18px" onclick="addSchoolTask('${esc(c.name)}')">追加</button>
      </div>
    </div>`;

  // ── 4. Recruiting history (chronological, real timestamps only) ─────────────
  const hist = [];
  const pushH = (ts, text) => { if (ts) hist.push({ ts, text }); };
  if (savedRow) pushH(savedRow.created_at, 'この大学を保存しました');
  coaches.forEach(cc => {
    pushH(cc.created_at, `コーチを追加しました「${cc.coach_name || ''}」`);
    (BAP_STATE.messagesByContact[String(cc.id)] || []).forEach(m => {
      const meta = INTERACTION_META[interactionKind(m)] || { label: 'やり取り' };
      pushH(m.sent_at || m.created_at, `${meta.label}を記録しました「${cc.coach_name || ''}」`);
    });
  });
  (BAP_STATE.drafts || []).filter(d => coachIds.includes(String(d.contact_id))).forEach(d => pushH(d.created_at, '下書きを作成しました'));
  schoolTasks.forEach(t => pushH(t.created_at, `タスクを追加しました「${stripName(t.text)}」`));
  hist.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));

  const historyCard = `
    <div class="sec" style="margin-top:20px;padding-bottom:32px">
      <div class="t11" style="margin-bottom:10px">この大学との履歴</div>
      ${hist.length ? `<div class="card" style="padding:2px 16px">
        ${hist.map((h, i) => `<div style="display:flex;gap:12px;padding:12px 0;${i < hist.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
          <div style="width:76px;flex-shrink:0;font-size:12px;color:var(--text3)">${fmtDateJP(h.ts)}</div>
          <div style="flex:1;font-size:13px;color:var(--text2);line-height:1.6">${escapeHtml(h.text)}</div>
        </div>`).join('')}
      </div>` : `<div class="card" style="padding:16px;font-size:13px;color:var(--text3);line-height:1.7">まだ履歴はありません。保存・コーチ追加・メール送信・タスク追加がここに記録されます。</div>`}
    </div>`;

  return blockerCard + crossCard + timelineCard + tasksCard + historyCard;
}

// ── Coach Relationship Timeline (per-coach, factual only) ────────────────────
// Derives a chronological history for ONE coach from existing records only:
// coach_messages (sent/received), coach_contacts (created_at / status /
// last_activity_at / next_action), and tasks whose text names this coach.
// No lifecycle simulation, no predicted phases, no scoring. Every item = a real record.
const COACH_TL_META = {
  contact:  ['登録',         'b-green'],
  message:  ['メッセージ',   'b-blue'],
  task:     ['タスク',       'b-gray'],
  followup: ['フォローアップ','b-purple'],
};
function buildCoachTimeline(c) {
  const items = [];
  const push = (ts, kind, text, onclick) => { if (ts) items.push({ ts, kind, text, onclick }); };

  // Contact registered (real: created_at).
  push(c.created_at, 'contact', 'このコーチを登録しました', "S.contactTab='profile';render()");

  // Interactions of every kind (real: coach_messages) — labeled by interaction type.
  (BAP_STATE.messagesByContact[String(c.id)] || []).forEach(m => {
    const ts = m.sent_at || m.created_at;
    const meta = INTERACTION_META[interactionKind(m)] || { label: 'やり取り' };
    const detail = m.title || (m.body || '').replace(/\s+/g, ' ').trim();
    const snippet = detail ? `「${detail.length > 40 ? detail.slice(0, 40) + '…' : detail}」` : '';
    push(ts, 'message', snippet ? `${meta.label} ${snippet}` : meta.label, "S.contactTab='messages';render()");
  });

  // Tasks that name this coach (existing text matching only).
  const cname = (c.coach_name || '').trim();
  if (cname) (BAP_STATE.tasks || []).filter(t => (t.text || '').includes(cname)).forEach(t => {
    const txt = (t.text || '').replace(/^\[[^\]]+\]\s*/, '');
    push(t.created_at, 'task', `タスクを作成しました「${txt}」`, c.college_id ? `openHub('${c.college_id}','plan')` : "go('home')");
  });

  // NOTE: coach_contacts.status is intentionally NOT a timeline item — it is a
  // CURRENT STATE (no historical progression). It stays in the header + 情報 tab only.

  // Follow-up action (real: next_action + last_activity_at).
  if (c.next_action && String(c.next_action).trim()) push(c.last_activity_at || c.created_at, 'followup', `次のアクション: ${c.next_action}`, "S.contactTab='profile';render()");

  return items;
}

          return `<div class="card" style="padding:12px 14px">

    <div style="padding:20px 20px 0">
      <div class="t11" style="margin-bottom:10px">次のアクション</div>
      <div style="display:flex;gap:8px">
        <input id="naInput" class="inp" style="flex:1" value="${escapeHtml(c.next_action)}" placeholder="例: フォローアップメールを送る"/>

      ${suggestedNextAction(c.status) ? `<div style="margin-top:8px;font-size:12px;color:var(--text3)">提案: <span style="color:var(--blue);font-weight:600;cursor:pointer" onclick="document.getElementById('naInput').value='${suggestedNextAction(c.status)}'">${suggestedNextAction(c.status)}</span>（ステータスに基づく・変更可）</div>` : ''}
    </div>
    <div style="padding:20px 20px 0">
      <div class="t11" style="margin-bottom:10px">情報</div>
      <div class="card" style="padding:0 16px">

          c.coach_email ? ['メール', c.coach_email] : null,

          <div style="font-size:14px;font-weight:600;text-align:right;word-break:break-word">${v}</div>
        </div>`).join('') || '<div style="padding:13px 0;font-size:14px;color:var(--text3)">追加情報はありません</div>'}
      </div>
    </div>
    <div style="padding:24px 20px 32px">
      <button class="btn btn-border" style="width:100%" onclick="deleteContact('${c.id}')">このコーチを削除</button>
    </div>`;

  return `<div class="anim">
    <div style="padding:52px 20px 0;background:var(--white)">
      <div class="back" onclick="closeSub()">コーチ連絡</div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:14px">
        ${coachAvatar(c, 56)}
        <div style="min-width:0">
          <div class="t18" style="margin-bottom:4px">${c.coach_name || ''}</div>
          <div style="font-size:13px;color:var(--text3)">${[c.coach_role, c.coach_email].filter(Boolean).join(' · ')}</div>
          <div style="margin-top:8px"><span class="badge ${st.badge}">${st.label}</span></div>
        </div>
      </div>
      <div style="display:flex;margin-top:16px;overflow-x:auto">
        ${tabs.map(([k,l])=>`<div onclick="S.contactTab='${k}';render()" style="padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;color:${tab===k?'var(--navy)':'var(--text3)'};border-bottom:2px solid ${tab===k?'var(--navy)':'transparent'}">${l}</div>`).join('')}
      </div>
    </div>
    <div style="border-top:1px solid var(--border)"></div>
    ${tab === 'messages' ? messagesTab : tab === 'drafts' ? draftsTab : tab === 'timeline' ? timelineTab : profileTab}
  </div>`;
}

async function saveDraftEdit(id) {
  const subj = (document.getElementById('draftSubject')||{}).value || null;
  const body = (document.getElementById('draftBody')||{}).value || '';
  if (!body.trim()) { alert('本文を入力してください'); return; }
  const d = (BAP_STATE.drafts || []).find(x => String(x.id) === String(id));
  if (await dbUpdate('email_drafts', id, { subject: subj, body, updated_at: new Date().toISOString() })) {
    S.contactTab = 'drafts';
    if (d) openSub('contact', d.contact_id);
  }
}

// ── AIメールアシスタント（コーチ連絡ごと・データ連動の英語メール下書き） ──────
// Deterministic templates personalized ONLY from the player's real profile +
// the coach contact + the entered school. Never fabricates data. Produces an
// English subject/body + a Japanese explanation of the structure.
function buildEmail(type, contact) {
  const p = BAP_STATE.player || {};
  const nm = p.name || '[Your Name]';
  const gy = p.grad_year || '';
  const pos = p.position || '';
  const mySchool = p.school || 'my high school';
  const school = (S.emailSchool || '').trim();
  const schoolRef = school || 'your program';
  const coach = (contact && contact.coach_name) || '';
  const greet = coach ? `Dear Coach ${coach},` : 'Dear Coach,';
  const gpa = parseFloat(p.gpa);
  const strongGpa = !isNaN(gpa) && gpa >= 3.5;
  const hasVideo = (BAP_STATE.videos || []).length > 0;
  const defs = BAP_STATE.metricDefs || [];
  const metrics = (BAP_STATE.metrics || []).filter(m => m.value != null && m.value !== '').slice(0, 5);
  const metricLines = metrics.map(m => { const d = defs.find(x => x.metric_key === m.metric_key); return `- ${d ? (d.label_en || d.metric_key) : m.metric_key}: ${m.value}${d && d.unit ? ' ' + d.unit : ''}`; });
  const idLine = `I am a baseball player at ${mySchool}${gy ? `, Class of ${gy}` : ''}${pos ? `, and I play ${pos}` : ''}.`;
  const sigBase = [nm, p.contact_email || '', p.phone || ''].filter(Boolean).join('\n');
  const sig = closing => `${closing}\n${sigBase}`;

  let subject, body, explanation, attachments = [];
  if (type === 'followup' || type === 'thankyou' || type === 'camp' || type === 'update') {
    // handled below; default to initial otherwise
  }
  if (type === 'initial') {
    const parts = [greet, '', `My name is ${nm}. ${idLine}`, '',
      `I am reaching out because I am very interested in ${schoolRef}. I believe I could contribute to your program both athletically and academically.`];
    if (strongGpa) parts.push('', `I take academics seriously and currently hold a GPA of ${p.gpa}.`);
    if (metricLines.length) parts.push('', 'Some of my current metrics:', metricLines.join('\n'));
    if (hasVideo) parts.push('', 'I have a highlight video available and would be happy to share the link.');
    parts.push('', 'I would welcome the opportunity to learn more about your program and the recruiting process. Thank you very much for your time and consideration.', '', sig('Sincerely,'));
    subject = `[Baseball Prospect] ${nm}${gy ? ` – Class of ${gy}` : ''}${pos ? `, ${pos}` : ''}`;
    body = parts.join('\n');
    explanation = '初回メールは「自己紹介 → 興味の理由 → 客観的な実績（成績・数値・動画）→ 依頼」の順が基本です。短く丁寧に、事実だけを伝えるとコーチが読みやすくなります。';
    attachments = ['ハイライト動画のリンク', '成績証明書（transcript）', 'プロフィール / 経歴'];
  } else if (type === 'followup') {
    const parts = [greet, '', `I hope you are doing well. I wanted to follow up on my previous email regarding my interest in ${schoolRef}.`, '',
      'I remain very interested in your program and would welcome the chance to connect.'];
    if (hasVideo || metricLines.length) parts.push('', 'Since my last message, I have continued to update my profile' + (hasVideo ? ', including new video footage' : '') + (metricLines.length ? ' and current metrics' : '') + '.');
    parts.push('', 'I understand how busy you are, and I appreciate any time you can offer.', '', sig('Best regards,'));
    subject = `Following up – ${nm}${gy ? ` (Class of ${gy})` : ''}`;
    body = parts.join('\n');
    explanation = 'フォローアップは簡潔に。相手の時間を尊重しつつ、前回からの新情報（動画・数値の更新）があれば一言添えると効果的です。1〜2週間ほど空けて送るのが目安です。';
    attachments = ['更新したハイライト動画', '最新のスタッツ'];
  } else if (type === 'camp') {
    subject = `Camp Inquiry – ${nm}${gy ? ` (Class of ${gy})` : ''}`;
    body = [greet, '', `My name is ${nm}. ${idLine}`, '',
      'I am very interested in attending your baseball camp or showcase. Could you please share the dates, registration details, and cost?', '',
      'I see it as a great opportunity to showcase my abilities and learn more about your program in person.', '',
      'Thank you for your time.', '', sig('Best regards,')].join('\n');
    explanation = 'キャンプ問い合わせは、日程・費用・登録方法を具体的に尋ねます。参加意欲と簡単な自己紹介を添えると丁寧です。';
    attachments = ['ハイライト動画のリンク'];
  } else if (type === 'thankyou') {
    subject = `Thank you – ${nm}`;
    body = [greet, '', `Thank you very much for taking the time to speak with me. Our conversation strengthened my interest in ${schoolRef}.`, '',
      'I would be honored to have the opportunity to contribute to your program, and I look forward to hearing about the next steps.', '',
      sig('Best regards,')].join('\n');
    explanation = 'お礼メールはやり取りや面談の後、できれば24時間以内に送ります。感謝と、引き続きの関心を簡潔に伝えます。';
    attachments = [];
  } else { // update
    const parts = [greet, '', 'I hope you are well. I wanted to share a quick update on my progress since we last connected.'];
    const updates = [];
    if (hasVideo) updates.push('- I have uploaded a new highlight video (link available on request).');
    if (strongGpa) updates.push(`- My current GPA is ${p.gpa}.`);
    if (metricLines.length) { updates.push('- Updated metrics:'); updates.push(metricLines.join('\n')); }
    if (updates.length) parts.push('', updates.join('\n'));
    else parts.push('', 'I continue to train and work toward my goals, and I remain very interested in your program.');
    parts.push('', `I remain very interested in ${schoolRef} and would welcome any opportunity to connect.`, '', sig('Best regards,'));
    subject = `Update – ${nm}${gy ? ` (Class of ${gy})` : ''}`;
    body = parts.join('\n');

    attachments = ['新しいハイライト動画', '最新の成績証明書'];
  }
  return { subject, body, explanation, attachments };
}

// ── リクルーティング分析（レベル適性） ───────────────────────────────────────
// Per-division fit verdict from the player's own metrics + academics vs 目安.
function _levelVerdict(division) {
  const ath = athleticScore(division);
  const aca = academicScore(division);
  const athOk = _athValid(ath);
  if (!athOk && aca.score == null) return { label: '情報不足', badge: 'b-gray' };
  const vals = [];
  if (athOk) vals.push(ath.score);
  if (aca.score != null) vals.push(aca.score);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  if (avg >= 85) return { label: '適性あり', badge: 'b-green' };
  if (avg >= 70) return { label: '挑戦圏', badge: 'b-blue' };
  return { label: '要強化', badge: 'b-amber' };
}

// ============================================================================
// RECRUITING FIT ENGINE — an INTERPRETATION layer over the existing scoring.
// It does NOT modify athleticScore / DIVISION_BENCH / computeMatch. It reuses
// their outputs and layers deterministic PREFERENCE-based ranking + explanations
// to answer "where do I actually fit, and why?". Preferences affect ranking only.
// ============================================================================
const FIT_SIZE_JP = { small: '小規模', medium: '中規模', large: '大規模' };
const FIT_SEL_JP = { high: '難関', medium: '中程度', low: '入りやすい' };
const FIT_PRIORITY_JP = { baseball: '野球重視', balanced: 'バランス', academic: '学業重視' };
function getFitPrefs() {
  const saved = (BAP_STATE.player && BAP_STATE.player.preferences) || {};
  return Object.assign({ regions: [], size: 'any', selectivity: 'any', climate: 'any', financial: 'any', priority: 'balanced' }, saved, S.fitPrefs || {});
}
let _fitPrefsTimer = null;
function persistFitPrefs() {
  clearTimeout(_fitPrefsTimer);
  _fitPrefsTimer = setTimeout(async () => {
    try { const uid = await _uidOrNull(); if (!uid || !BAP.client) return; const prefs = getFitPrefs(); await BAP.client.from('players').update({ preferences: prefs }).eq('id', uid); if (BAP_STATE.player) BAP_STATE.player.preferences = prefs; } catch (e) { /* preferences are non-critical */ }
  }, 600);
}
function setFitPref(key, val) { S.fitPrefs = Object.assign({}, getFitPrefs(), { [key]: val }); S.fitShow = 20; persistFitPrefs(); render(); }
function fitShowMore() { S.fitShow = (S.fitShow || 20) + 20; render(); }
function toggleFitRegion(r) { const cur = getFitPrefs().regions || []; const next = cur.includes(r) ? cur.filter(x => x !== r) : cur.concat([r]); setFitPref('regions', next); }
function _fitClimate(c) { const r = REGION_OF[c.state]; if (!r) return null; return (r === '南部' || r === '西部') ? 'warm' : 'cold'; }
function _fitSize(c) { return c.enrollment == null ? null : (c.enrollment < 5000 ? 'small' : c.enrollment <= 15000 ? 'medium' : 'large'); }
function _fitSel(c) { return c.acceptance_rate == null ? null : (c.acceptance_rate < 30 ? 'high' : c.acceptance_rate <= 60 ? 'medium' : 'low'); }

// The Fit Engine consumes computeMatch OUTPUT only — the single source of truth for
// school relationship strength. It does NOT call athleticScore / academicFitForCollege
// directly, and does NOT read saved/decision status. It only filters, groups, labels,
// explains, and reorders based on computeMatch's published fit breakdown.
function buildRecruitingFitProfile() {
  const p = BAP_STATE.player || {};
  const prefs = getFitPrefs();
  const colleges = BAP_STATE.colleges || [];
  const gpa = parseFloat(p.gpa);
  const targetDivs = (p.target_division || '').split(',').map(s => s.trim()).filter(Boolean);
  const regionSel = prefs.regions || [];
  // Cosmetic role label + "athletic data registered?" flag come from PLAYER DATA
  // (position / metric presence), not from any scoring engine.
  const toks = (p.position || '').toUpperCase().split(/[,\/\s]+/).map(s => s.trim()).filter(Boolean);
  const roleKey = toks.includes('P') ? 'pitcher' : toks.includes('C') ? 'catcher' : _positionPlayerRole(toks);
  const athReady = recruitingContext().profileSignals.athReady; // shared visibility flag (display only)

  // fitLevel is a LABEL derived ONLY from computeMatch's published fit breakdown
  // (athletic + academic fit). It is not a new score and does not compete with computeMatch.
  function classify(c) {
    const mt = computeMatch(c);   // ← single source of truth
    const bf = mt.athletic;       // athletic fit — computeMatch output (null if incomplete)
    const af = mt.academic;       // academic fit — computeMatch output
    if (bf == null || bf < 50) return null;                                 // below reach → excluded
    const reasons = [];
    // Personal preferences: FILTER + REASONS + tiebreak COUNT only. Never a score.
    let matchCount = 0;
    const dims = [];
    const check = (val, ok, reasonOk) => { if (val != null) { dims.push(1); if (ok) { matchCount++; if (reasonOk) reasons.push(reasonOk); } } };
    if (regionSel.length) { const r = REGION_OF[c.state]; check(r, !!r && regionSel.includes(r), r ? `地域: 希望の${r}` : ''); }
    if (prefs.size !== 'any') { const s = _fitSize(c); check(s, s === prefs.size, s ? `規模: ${FIT_SIZE_JP[s]}` : ''); }
    if (prefs.selectivity !== 'any') { const s = _fitSel(c); check(s, s === prefs.selectivity, s ? `選抜度: ${FIT_SEL_JP[s]}` : ''); }
    if (prefs.climate !== 'any') { const cl = _fitClimate(c); check(cl, cl === prefs.climate, cl ? `気候: ${cl === 'warm' ? '温暖' : '冷涼'}` : ''); }
    if (prefs.financial === 'important') { const ok = c.scholarship === true || (c.net_cost != null && c.net_cost < 25000); dims.push(1); if (ok) { matchCount++; reasons.push('費用: 奨学金／負担額が条件に合致'); } }
    // personalFit stays as an INFORMATIONAL breakdown value (share of prefs matched), never a ranker.
    const pf = dims.length ? Math.round((matchCount / dims.length) * 100) : null;

    // Base tier from athletic + academic fit, THEN modulated by how well the school
    // matches the athlete's stated preferences — so the selections actually MOVE schools
    // between 高/中/成長フィット, not merely reorder them within a fixed bucket.
    let fitLevel = fitLevelFromMatch(bf, af);
    // 高フィット is GATED by how well the school matches the athlete's STATED preferences.
    // The more (and more specific) preferences they set, the fewer schools clear it — so the
    // count is driven by the survey, not a fixed number. With no preferences set, it falls
    // back to ability alone (athletic + academic).
    if (pf != null) {
      if (fitLevel === 'high' && pf < 75) fitLevel = 'medium';            // strong ability but weak preference match → not top-tier
      else if (fitLevel === 'medium' && pf < 34) fitLevel = 'development'; // ignores prefs entirely → drops further
    }

    if (bf != null) reasons.unshift(`競技面: ${c.division}目安に対して ${bf}%`);
    if (af != null) reasons.splice(1, 0, `学業面: ${af}% フィット`);

    return { schoolId: c.id, name: c.name, division: c.division, state: c.state, fitLevel, breakdown: { baseballFit: bf, academicFit: af, personalFit: pf }, lowConf: !!mt.lowConf, matchCount, reasons };
  }

  let cand = colleges;
  if (targetDivs.length) cand = cand.filter(c => targetDivs.includes(c.division)); // hard filter
  if (regionSel.length) cand = cand.filter(c => regionSel.includes(REGION_OF[c.state])); // hard filter
  const classified = cand.map(classify).filter(Boolean);
  // Rank ANCHORED to computeMatch output: fitLevel first, then its two fit signals
  // (athletic / academic breakdown). `priority` only flips WHICH signal leads — a
  // deterministic reorder, never a weight or a new score. Preference match count is
  // a final tiebreak (a count, not a score).
  const LR = { high: 0, medium: 1, development: 2 };
  const bfCmp = (a, b) => b.breakdown.baseballFit - a.breakdown.baseballFit;
  const afCmp = (a, b) => (b.breakdown.academicFit || 0) - (a.breakdown.academicFit || 0);
  const signalCmp = prefs.priority === 'academic' ? (a, b) => afCmp(a, b) || bfCmp(a, b) : (a, b) => bfCmp(a, b) || afCmp(a, b);
  classified.sort((a, b) =>
    LR[a.fitLevel] - LR[b.fitLevel]
    || signalCmp(a, b)
    || b.matchCount - a.matchCount
    || a.name.localeCompare(b.name));
  const ranked = classified.slice(0, 300);
  const countLevel = lv => classified.filter(x => x.fitLevel === lv).length;

  return {
    playerSnapshot: { name: p.name || '', role: ROLE_JP[roleKey] || '', gpa: isNaN(gpa) ? null : gpa, targetDivs, athReady },
    rankedSchools: ranked,
    counts: { high: countLevel('high'), medium: countLevel('medium'), development: countLevel('development'), total: classified.length },
  };
}
const FIT_LEVEL_META = { high: { label: 'High Fit', jp: '高フィット', badge: 'b-green' }, medium: { label: 'Medium Fit', jp: '中フィット', badge: 'b-blue' }, development: { label: 'Development Fit', jp: '成長フィット', badge: 'b-amber' } };
// SINGLE mapping from computeMatch's published fit signals → a fit-level LABEL.
// Used by BOTH the Fit Engine and the School Dashboard so they can never drift.
// This is a label, not a score; it derives ONLY from computeMatch output.
function fitLevelFromMatch(bf, af) {
  if (bf == null) return null;
  if (bf < 68) return 'development';
  // "high" is reserved for a genuinely strong all-around match, so it stays selective.
  return (bf >= 82 && (af == null || af >= 70)) ? 'high' : 'medium';
}

// ============================================================================
// RELATIVE BENCHMARK VIEW — a NON-SCORING visualization. It maps each metric onto a
// simple RELATIVE SCALE around the division's 目安 (benchmark = 50) via linear
// interpolation. It is NOT population data, NOT a statistical percentile, and NOT a
// score. It never modifies computeMatch / athleticScore / DIVISION_BENCH and never
// feeds ranking or decisions.
//
// INVARIANT: this must never be read as real population/percentile data. It is a
// deterministic scaling of the player's value against a single reference point (目安).
const BENCH_SPREAD = { // half-range as a fraction of the 目安 (defines the reference scale only)
  fastball_velocity: 0.07, throwing_velocity: 0.07, exit_velocity: 0.07,
  sixty_yard: 0.05, home_to_first: 0.05, pop_time: 0.06,
};
// Relative position (0–100) of a value vs the division 目安 (=50), by linear scaling.
// +2 half-ranges above 目安 → ~100; −2 below → ~0. Direction-aware. NOT a percentile.
function metricRelativePosition(key, division, value) {
  const bench = DIVISION_BENCH.athletic[key] && DIVISION_BENCH.athletic[key][division];
  if (bench == null || value == null) return null;
  const half = bench * (BENCH_SPREAD[key] || 0.07);
  const delta = LOWER_BETTER.includes(key) ? (bench - value) : (value - bench); // higher = more competitive
  const pos = 50 + (delta / (2 * half)) * 50;
  return Math.round(Math.max(1, Math.min(99, pos)));
}
// Player's entered metrics (latest season/snapshot) placed on the division 目安 scale.
function buildBenchmarkPositions(division) {
  const defs = BAP_STATE.metricDefs || [];
  const rows = [];
  Object.keys(DIVISION_BENCH.athletic).forEach(key => {
    const v = latestMetricValue(key);
    if (v == null) return;
    const def = defs.find(d => d.metric_key === key);
    rows.push({ key, label: def ? def.label_ja : metricLabel(key), unit: def ? def.unit : '', value: v, benchmark: DIVISION_BENCH.athletic[key][division], position: metricRelativePosition(key, division, v), lower: LOWER_BETTER.includes(key) });
  });
  return rows;
}

// ── 志望校戦略（保存した学校だけを対象にした個別プラン） ─────────────────────
// Reuses computeMatch / factor helpers / scoreImprovements — no new scoring.
function _stars(count, n) { return Math.max(1, Math.min(5, Math.round((count / Math.max(1, n)) * 5))); }
function buildStrategy() {
  const schools = (BAP_STATE.saved || []).map(s => findCollege(s.college_id)).filter(Boolean);
  const n = schools.length;
  if (n === 0) return { n: 0 };
  const p = BAP_STATE.player || {};
  const defs = BAP_STATE.metricDefs || [];
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const hasVideo = (BAP_STATE.videos || []).length > 0;
  const hasGpa = hasNum(p.gpa), hasToefl = hasNum(p.toefl), hasTest = hasNum(p.sat) || hasNum(p.act);
  const athKeys = Object.keys(DIVISION_BENCH.athletic).filter(k => latestMetricValue(k) != null); // season-aware
  const noMetrics = athKeys.length === 0, noContacts = (BAP_STATE.contacts || []).length === 0;

  const scores = schools.map(c => computeMatch(c).score);
  const overview = { n, avg: Math.round(scores.reduce((a, b) => a + b, 0) / n), max: Math.max(...scores), min: Math.min(...scores) };

  // Shared gap analysis: how many saved schools each improvement would help.
  const gap = {};
  const bump = (id, label, act, why) => { if (!gap[id]) gap[id] = { id, label, act, why, count: 0 }; gap[id].count++; };
  schools.forEach(c => {
    if (!hasVideo) bump('video', 'ハイライト動画を追加する', "S.profileTab='videos';go('profile')", 'コーチが最初に確認する資料です。');
    if (!hasGpa) bump('gpa', 'GPAを入力する', 'openProfileEdit()', '学業評価の基準になります。');
    else { const af = academicFitForCollege(c); if (af != null && af < 90) bump('gpa_up', 'GPA・学力をさらに高める', null, '選抜度の高い学校の学業基準に近づけます。'); }
    if (!hasToefl) bump('toefl', 'TOEFLスコアを入力する', 'openProfileEdit()', '英語力の証明になります。');
    if (!hasTest) bump('test', 'SAT / ACTスコアを入力する', 'openProfileEdit()', '学力の客観的な証明になります。');
    if (noMetrics) bump('metrics', 'パフォーマンス指標を追加する', "S.profileTab='metrics';go('profile')", '数値がないと競技力を評価されにくいです。');
    else athKeys.forEach(key => {
      const target = DIVISION_BENCH.athletic[key][c.division];
      const v = latestMetricValue(key), lower = LOWER_BETTER.includes(key), ok = lower ? v <= target : v >= target;
      if (target && !ok) { const def = defs.find(d => d.metric_key === key); bump('m_' + key, `${def ? def.label_ja : metricLabel(key)}を向上させる`, null, '志望校の競技水準に近づけます。'); }
    });
    if (noContacts) bump('coach', 'コーチに連絡する', 'openAddContact()', 'リクルートは自分から動くことで始まります。');
  });
  const gaps = Object.values(gap).sort((a, b) => b.count - a.count).map(g => ({ ...g, stars: _stars(g.count, n) }));

  // Per-school strategy (sorted by match, highest first).
  const perSchool = schools.map(c => {
    const mt = computeMatch(c);
    const factors = [...athFactors(c), ...acaFactors(c), ...recFactors(c)];
    return {
      c, score: mt.score, conf: scoreConfidence(mt),
      strengths: factors.filter(f => f.status === 'good').map(f => f.label).slice(0, 3),
      weaknesses: factors.filter(f => f.status !== 'good').map(f => f.label).slice(0, 3),
      nextAct: scoreImprovements(c)[0] || null,
    };
  }).sort((a, b) => b.score - a.score);

  // Timeline buckets (adapted by graduation year).
  const yearsLeft = p.grad_year ? (p.grad_year - new Date().getFullYear()) : null;
  const tl = { now: [], three: [], six: [], apply: [] };
  gaps.forEach(g => {
    if (['video', 'toefl', 'test', 'gpa', 'metrics'].includes(g.id)) tl.now.push(g.label);
    else if (g.id === 'coach') tl.three.push(g.label);
    else tl.six.push(g.label);
  });
  if (yearsLeft == null) tl.apply.push('卒業年度を入力すると出願時期の目安が表示されます');
  else if (yearsLeft <= 1) { tl.apply.push('志望校の出願書類を準備する'); tl.apply.push('コーチへ最終フォローアップを行う'); }
  else tl.apply.push(`卒業年度（${p.grad_year}）の前年から出願準備を始める`);

  return { n, overview, gaps, perSchool, yearsLeft, tl };
}

// Relative time for the activity feed (今日 / 昨日 / N日前 / absolute date).
function fmtFeedTime(ts) {
  const d = daysUntil(ts);
  if (d == null) return '';
  const ago = -d;
  if (ago <= 0) return '今日';
  if (ago === 1) return '昨日';
  if (ago < 7) return ago + '日前';
  return fmtDateJP(ts);
}

function buildPortfolio() {
  const p = BAP_STATE.player || {};
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const gpa = parseFloat(p.gpa);
  const toefl = hasNum(p.toefl);
  const videos = (BAP_STATE.videos || []).length;
  const saved = (BAP_STATE.saved || []);
  const contacts = (BAP_STATE.contacts || []);
  const msgsOf = id => BAP_STATE.messagesByContact[String(id)] || [];

  // Enrich each resolvable saved school with its coach + message state.
  const schools = saved.map(s => {
    const c = findCollege(s.college_id);
    if (!c) return null;
    const coaches = collegeContacts(c.id);
    const msgs = coaches.flatMap(cc => msgsOf(cc.id));
    return {
      s, c, name: c.name, coaches,
      outbound: msgs.some(m => m.direction === 'outbound'),
      inbound: msgs.some(m => m.direction === 'inbound'),
      meeting: coaches.some(cc => cc.status === 'meeting'),
      minGpa: parseFloat(c.min_gpa),
    };
  }).filter(Boolean);

  // 1. Portfolio — factual counts only.
  const totalOutbound = contacts.flatMap(cc => msgsOf(cc.id)).filter(m => m.direction === 'outbound').length;
  const portfolio = [
    ['保存大学', saved.length, '校'],
    ['コーチ登録', contacts.length, '人'],
    ['メール送信済み', totalOutbound, '件'],
    ['返信あり', schools.filter(x => x.inbound).length, '校'],
    ['面談予定', schools.filter(x => x.meeting).length, '校'],
  ];

  // 2. Schools needing attention — top blocker per saved school (shared model).
  //    Card routes directly: coach/email blocker → コーチ tab, else プラン tab.
  const attention = [];
  schools.forEach(x => {
    const bl = schoolBlockers(x.c);
    if (!bl.length) return;
    const b = bl[0];
    const tab = (b.type === 'coach' || b.type === 'email') ? 'coaches' : 'plan';
    attention.push({ id: x.c.id, name: x.name, blocker: b.short || b.label, tab });
  });

  // 3. Shared priorities. Global tasks (video/toefl/gpa) are true one-action-many-
  //    schools work (bulk-eligible), counted from crossSchoolImpact. Coach outreach
  //    is per-school (not bulk) and counted directly from the school list.
  const impact = crossSchoolImpact().impact;
  const cnt = t => (impact[t] || []).length;
  const shared = [];
  if (cnt('video')) shared.push({ type: 'video', label: 'ハイライト動画を1本追加する', count: cnt('video'), bulk: true, btn: '動画を追加', act: 'openVideos()' });
  if (cnt('toefl')) shared.push({ type: 'toefl', label: 'TOEFLスコアを登録する', count: cnt('toefl'), bulk: true, btn: '登録する', act: 'openProfileEdit()' });
  if (cnt('gpa')) shared.push({ type: 'gpa', label: 'GPAを要件まで上げる', count: cnt('gpa'), bulk: true, btn: 'プロフィール', act: 'openProfileEdit()' });
  const coachCount = schools.filter(x => !x.coaches.length || !x.outbound).length;
  if (coachCount) shared.push({ type: 'coach', label: 'コーチに連絡する', count: coachCount, bulk: false, btn: '大学を見る', act: "closeSub();S.collegeView='saved';go('colleges')" });
  shared.sort((a, b) => b.count - a.count);

  // 4. Activity feed — chronological across every school (real timestamps only).
  const feed = [];
  const push = (ts, text) => { if (ts) feed.push({ ts, text }); };
  schools.forEach(x => {
    push(x.s.created_at, `${x.name} を保存しました`);
    x.coaches.forEach(cc => {
      push(cc.created_at, `${x.name} にコーチを追加しました`);
      msgsOf(cc.id).forEach(m => push(m.sent_at || m.created_at, m.direction === 'inbound' ? `${x.name} から返信がありました` : `${x.name} にメールを送信しました`));
    });
  });
  (BAP_STATE.tasks || []).forEach(t => { const x = schools.find(y => (t.text || '').includes(y.name)); if (x) push(t.created_at, `${x.name} にタスクを追加しました`); });
  feed.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));

  return { n: saved.length, portfolio, attention, shared, activity: feed.slice(0, 25) };
}

// ============================================================================
// RECRUITING CALENDAR — a coordination layer, NOT a new data system. It only
// visualizes time-based rows that already exist: coach_contacts, tasks, camps.
// Every event traces to a real timestamp/field. No generated dates, no scoring,
// no AI. College application deadlines are skipped (no such field) — never invented.
// ============================================================================
const CAL_TYPE = {
  coach_follow_up:     { label: 'コーチ', badge: 'b-blue' },
  camp_event:          { label: 'キャンプ', badge: 'b-amber' },
  test_event:          { label: '試験',   badge: 'b-purple' },
  application_deadline:{ label: '出願',   badge: 'b-red' },
  task_event:          { label: 'タスク', badge: 'b-gray' },
};

function buildRecruitingCalendar() {
  const events = [];
  const savedCols = (BAP_STATE.saved || []).map(s => findCollege(s.college_id)).filter(Boolean);

  // 1. coach_follow_up — from coach_contacts (status + last_activity_at + next_action).
  (BAP_STATE.contacts || []).forEach(c => {
    if (c.status === 'closed') return;                    // 終了したやり取りは除外
    const hasNext = c.next_action && String(c.next_action).trim();
    if (!needsFollowUp(c) && !hasNext) return;            // only actionable ones
    const date = c.last_activity_at || c.created_at;
    if (!date) return;
    const col = c.college_id ? findCollege(c.college_id) : null;
    events.push({
      id: 'coach_' + c.id, type: 'coach_follow_up',
      title: hasNext ? c.next_action : `${c.coach_name || 'コーチ'}にフォローアップ`,
      date, related_school_id: col ? col.id : null, related_coach_id: c.id,
      source_label: `コーチ · ${c.coach_name || ''}${col ? ' / ' + col.name : ''}`,
      onclick: `openSub('contact','${c.id}')`,
    });
  });

  // 2. camp_event — from camps.camp_date, limited to camps at a SAVED school, upcoming.
  (BAP_STATE.camps || []).forEach(c => {
    if (!c.camp_date) return;
    const d = daysUntil(c.camp_date);
    if (d == null || d < 0) return;                       // upcoming only (real dates)
    const att = campSavedAttending(c);
    if (!att.length) return;                              // only camps tied to saved schools
    events.push({
      id: 'camp_' + c.id, type: 'camp_event', title: c.name || 'キャンプ', date: c.camp_date,
      related_school_id: att[0].id, related_coach_id: null,
      source_label: `キャンプ · ${[c.city, c.state].filter(Boolean).join(', ') || ''}`,
      onclick: `openSub('campDetail','${c.id}')`,
    });
  });

  // 3 & 5. tasks → test_event (TOEFL/SAT/ACT) or task_event. Real due_date or created_at.
  (BAP_STATE.tasks || []).forEach(t => {
    if (t.status === 'done') return;
    const date = t.due_date || t.created_at;
    if (!date) return;
    const text = t.text || '';
    const isTest = /toefl|sat|act|試験|テスト|eligibility|ncaa/i.test(text);
    const school = savedCols.find(col => text.includes(col.name));
    const title = text.replace(/^\[[^\]]+\]\s*/, '');    // strip [SchoolName]/[書類] prefix
    events.push({
      id: 'task_' + t.id, type: isTest ? 'test_event' : 'task_event', title,
      date, related_school_id: school ? school.id : null, related_coach_id: null,
      source_label: isTest ? '試験・スコア' : (school ? `タスク · ${school.name}` : 'タスク'),
      onclick: school ? `openHub('${school.id}','plan')` : "go('home')",
    });
  });

  // 4. application_deadline — colleges have no deadline field in this dataset → skip.

  // priority (proximity only) + sort: overdue first, then nearest upcoming.
  events.forEach(e => {
    const d = daysUntil(e.date);
    e._d = d == null ? 99999 : d;
    e.priority = d == null ? 'low' : (d < 0 || d <= 1) ? 'high' : d <= 7 ? 'med' : 'low';
  });
  events.sort((a, b) => a._d - b._d);
  return events;
}

// Day-bucket grouping for the agenda view.
function calGroups(events) {
  const g = { overdue: [], today: [], tomorrow: [], week: [], later: [] };
  events.forEach(e => {
    const d = e._d;
    if (d < 0) g.overdue.push(e);
    else if (d === 0) g.today.push(e);
    else if (d === 1) g.tomorrow.push(e);
    else if (d <= 7) g.week.push(e);
    else g.later.push(e);
  });
  return g;
}

function calEventCard(e) {
  const meta = CAL_TYPE[e.type] || { label: e.type, badge: 'b-gray' };
  return `<div class="card" style="padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px" onclick="${e.onclick}">

      </div>
      <div style="font-size:14px;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(e.title)}</div>
