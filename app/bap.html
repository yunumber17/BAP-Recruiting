async function doDeleteAccount() {
  if (S.deletingAccount) return;
  S.deletingAccount = true; render();
  try {
    if (!window.BAP || !BAP.client || !BAP.client.functions) throw new Error('unconfigured');
    const { data, error } = await BAP.client.functions.invoke('delete-account', { body: {} });
    if (error) throw error;
    if (data && data.error) throw new Error(data.error);
    try { await BAP.signOut(); } catch (e) { /* session already gone */ }
    S.deletingAccount = false; S.modal = null;
    BAP_STATE.player = null;
    S.page = 'auth'; S.authView = 'welcome'; S.authPassword = '';
    render();
    toast('アカウントを削除しました');
  } catch (e) {
    S.deletingAccount = false; render();
    toast('削除に失敗しました。時間をおいて再度お試しください。' + ((e && e.message) ? '（' + e.message + '）' : ''));
  }
}

// Real Supabase Google OAuth (frontend wiring only; uses the existing BAP client).
async function signInWithGoogle() {
  if (!window.BAP || !BAP.configured || !BAP.client) {

  try {

      provider: 'google',

// ============================================================================
// PROFILE COMPLETION FLOW — one guided place to enter everything that powers
// マッチング率 and 適性診断 (basic info, baseball profile, metrics, academics,
// preferences). Replaces the scattered entry points with a single progression
// the athlete can complete and re-open. Saves per step to the SAME tables the
// rest of the app already reads (players / performance_metrics / players.preferences).
// ============================================================================
function _prefsSet(prefs) {
  return !!((prefs.regions && prefs.regions.length) ||
    ['size', 'selectivity', 'climate', 'financial'].some(k => prefs[k] && prefs[k] !== 'any'));
}
// Completion model — read ONLY from saved data (never the staging object), so the
// percentage reflects what's actually persisted. 5 sections, evenly weighted.
function profileCompletion() {
  const p = BAP_STATE.player || {};
  let prefs = {}; try { prefs = getFitPrefs(); } catch (e) {}
  let athReady = false; try { athReady = recruitingContext().profileSignals.athReady; } catch (e) {}
  const has = v => v != null && String(v).trim() !== '';
  // A pitcher's fastball is the dominant metric — so "metrics done" REQUIRES it for
  // pitchers (otherwise マッチング率 / 適性診断 stay empty even with other numbers entered).
  const toks = (p.position || '').toUpperCase().split(/[,\/\s]+/).map(s => s.trim()).filter(Boolean);
  const isPitcher = toks.includes('P');
  let metricsDone = !!athReady;
  if (isPitcher) { try { metricsDone = latestMetricValue('fastball_velocity') != null; } catch (e) {} }
  const sections = [
    // "Never start at zero" (goal-gradient effect): account creation is a real
    // completed step — showing it done gives immediate momentum instead of a
    // demoralizing 0%. The user reads progress, not a mountain to climb.
    { key: 'account',   label: 'アカウント作成',   sub: 'ようこそ！最初のステップは完了です', done: true, step: 1 },
    { key: 'basic',     label: '基本情報',        sub: '名前・高校・卒業年',   done: has(p.name) && has(p.school) && has(p.grad_year), step: 1 },
    { key: 'baseball',  label: '野球プロフィール', sub: 'ポジション・投打',     done: has(p.position) && has(p.throws) && has(p.bats),   step: 2 },
    { key: 'metrics',   label: '野球指標',        sub: isPitcher ? 'ストレート球速・走力など' : '球速・走力・打球速度',  done: metricsDone,           step: 3 },
    { key: 'academics', label: '学業',            sub: 'GPA・テストスコア',    done: has(p.gpa),                                       step: 4 },
    { key: 'prefs',     label: '希望条件',        sub: '地域・規模・費用など',  done: _prefsSet(prefs),                                 step: 5 },
  ];
  const done = sections.filter(s => s.done).length;
  return { pct: Math.round(done / sections.length * 100), done, total: sections.length, sections };
}

// Seed the staging object (S.setupData) from the saved player so the flow shows
// current values. Handedness / positions are mapped back from DB codes to the JP
// labels the pickers use.
function openCompleteFlow(step) {
  const p = BAP_STATE.player || {};
  const back = v => (v == null ? '' : String(v));
  const THROWS_BACK = { R: '右', L: '左' };
  const BATS_BACK = { R: '右', L: '左', S: '両' };
  S.setupData = {
    name: back(p.name), name_en: back(p.name_en), school: back(p.school), year: back(p.grad_year),
    positions: (p.position || '').split(/[,\/\s]+/).map(s => s.trim()).filter(Boolean),
    throws: THROWS_BACK[p.throws] || '', bats: BATS_BACK[p.bats] || '',
    height_cm: back(p.height_cm), weight_kg: back(p.weight_kg),
    gpa: back(p.gpa), sat: back(p.sat), act: back(p.act), toefl: back(p.toefl),
    fastball_velocity: back(latestMetricValue('fastball_velocity')),
    throwing_velocity: back(latestMetricValue('throwing_velocity')),
    sixty_time: back(latestMetricValue('sixty_yard')),
    home_to_first: back(latestMetricValue('home_to_first')),
    exit_velocity: back(latestMetricValue('exit_velocity')),
  };
  S.completeStep = step || 1;
  openSub('complete', null);
}

// Metrics are time-series (measured_at). Insert a new dated row only when the
// value is present AND changed from the latest stored value — so re-opening the
// flow doesn't spam duplicate identical rows. Canonical keys only (engine reads these).
async function _saveCompleteMetrics() {
  const d = S.setupData || {};
  const num = v => (v === '' || v == null || isNaN(parseFloat(v))) ? null : parseFloat(v);
  const isP = (d.positions || []).includes('P');
  const rows = [
    ['fastball_velocity', isP ? d.fastball_velocity : null, 'mph'],
    ['throwing_velocity', d.throwing_velocity, 'mph'],
    ['sixty_yard',        d.sixty_time,        'sec'],
    ['home_to_first',     d.home_to_first,     'sec'],
    ['exit_velocity',     d.exit_velocity,     'mph'],
  ];
  for (const r of rows) {
    const key = r[0], nv = num(r[1]), unit = r[2];
    if (nv == null) continue;
    const cur = latestMetricValue(key);
    if (cur != null && Number(cur) === nv) continue; // unchanged → skip
    await dbInsert('performance_metrics', { metric_key: key, value: nv, unit: unit, measured_at: todayLocal() });
  }
}

// Save the CURRENT step's data to the DB, then advance. Per-step save means partial
// progress always persists and deep-linking into any step works.
async function advanceComplete(fromStep) {
  const d = S.setupData || {};
  const num = v => (v === '' || v == null || isNaN(parseFloat(v))) ? null : parseFloat(v);
  const int = v => (v === '' || v == null || isNaN(parseInt(v, 10))) ? null : parseInt(v, 10);
  const str = v => { v = (v || '').trim(); return v || null; };
  const arr = a => (a && a.length) ? a.join(', ') : null;
  const mapThrows = v => ({ '右': 'R', '左': 'L' }[v] || null);
  const mapBats = v => ({ '右': 'R', '左': 'L', '両': 'S' }[v] || null);

  if (fromStep === 1 && !str(d.name)) { alert('氏名を入力してください'); return; }

  let patch = null;
  if (fromStep === 1) patch = { name: str(d.name), name_en: str(d.name_en), school: str(d.school), grad_year: int(d.year), height_cm: num(d.height_cm), weight_kg: num(d.weight_kg) };
  else if (fromStep === 2) patch = { position: arr(d.positions), throws: mapThrows(d.throws), bats: mapBats(d.bats) };
  else if (fromStep === 4) patch = { gpa: num(d.gpa), sat: int(d.sat), act: int(d.act), toefl: int(d.toefl) };

  if (patch) { const saved = await upsertPlayerRow(patch); if (!saved) return; applyPlayer(saved); }
  if (fromStep === 3) await _saveCompleteMetrics();
  bustMatchCache();
  S.completeStep = fromStep + 1;
  render(); if (scr()) scr().scrollTop = 0;
}
// Preferences (step 5) auto-save via setFitPref; the button only advances to the done screen.
function finishCompleteFlow() { bustMatchCache(); S.completeStep = 6; render(); if (scr()) scr().scrollTop = 0; }

function renderCompleteFlow() {
  const step = S.completeStep || 1;
  const comp = profileCompletion();
  const TOTAL = 5;
  const isP = (S.setupData.positions || []).includes('P');

  const header = `<div style="padding:52px 20px 18px;background:var(--white);border-bottom:1px solid var(--border)">
    <div class="back" onclick="closeSub()">戻る</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;margin-bottom:12px">
      <div class="t22">プロフィールを完成させる</div>
      <div style="font-size:24px;font-weight:800;color:var(--blue);line-height:1">${comp.pct}%</div>
    </div>
    <div style="display:flex;gap:6px">
      ${Array.from({ length: TOTAL }, (_, i) => `<div style="height:4px;flex:1;border-radius:99px;background:${(i + 1) <= Math.min(step, TOTAL) ? 'var(--blue)' : 'var(--border)'}"></div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:10px">入力するほど、マッチング率と大学提案の精度が上がります。</div>
  </div>`;

  const navBtns = (nextLabel, nextAction) => `<div style="display:flex;gap:8px;margin-top:8px">
    ${step > 1 ? `<button class="btn btn-border" style="flex:1" onclick="S.completeStep=${step - 1};render()">戻る</button>` : ''}
    <button class="btn btn-navy" style="flex:2" onclick="${nextAction}">${nextLabel}</button>
  </div>`;
  const wrap = (title, sub, inner) => `<div class="anim">${header}
    <div class="sec" style="margin-top:22px;padding-bottom:36px">
      <div class="t22" style="margin-bottom:4px">${title}</div>
      <div class="t13" style="margin-bottom:22px">${sub}</div>
      <div style="display:flex;flex-direction:column;gap:16px">${inner}</div>
    </div></div>`;

  if (step === 1) return wrap('基本情報', 'コーチが最初に見る情報です', `
    ${_suField('氏名（ローマ字）', 'name', 'Taro Yamada')}
    ${_suField('高校名（ローマ字）', 'school', '例: Toin Gakuen HS')}
    ${_suSelect('高校卒業年', 'year', Array.from({ length: 51 }, (_, i) => String(2000 + i)), '卒業年を選択')}
    ${_suField('身長 (cm)', 'height_cm', '178', 'number')}
    ${_suField('体重 (kg)', 'weight_kg', '73', 'number')}
    ${navBtns('保存して次へ', 'advanceComplete(1)')}`);

  if (step === 2) return wrap('野球プロフィール', 'ポジションは複数選択できます', `
    ${_suPills('ポジション', 'positions', ['P', 'C', '1B', '2B', '3B', 'SS', 'OF', 'DH', 'UTIL'])}
    ${_suRadio('投', 'throws', ['右', '左'])}
    ${_suRadio('打', 'bats', ['右', '左', '両'])}
    ${navBtns('保存して次へ', 'advanceComplete(2)')}`);

  if (step === 3) return wrap('野球指標', '分かる範囲で入力してください（後から編集できます）', `
    ${isP ? _suField('ピッチャーストレート球速 (mph)', 'fastball_velocity', '88', 'number') : ''}
    ${_suField('野手送球球速 (mph)', 'throwing_velocity', '85', 'number')}
    ${_suField('60ヤード走 (秒)', 'sixty_time', '6.8', 'number')}
    ${_suField('一塁到達タイム (秒)', 'home_to_first', '4.2', 'number')}
    ${_suField('打球初速 (mph)', 'exit_velocity', '90', 'number')}
    ${navBtns('保存して次へ', 'advanceComplete(3)')}`);

  if (step === 4) return wrap('学業・テストスコア', 'NCAAの出願要件に使用します', `
    ${_suField('累積GPA (4.0満点)', 'gpa', '3.6', 'number')}
    ${_suField('SAT（任意）', 'sat', '1200', 'number')}
    ${_suField('ACT（任意）', 'act', '25', 'number')}
    ${_suField('TOEFL（任意）', 'toefl', '80', 'number')}
    ${navBtns('保存して次へ', 'advanceComplete(4)')}`);

  if (step === 5) {
    const prefs = getFitPrefs();
    const opt = (key, val, label) => `<div class="fp ${prefs[key] === val ? 'on' : ''}" onclick="setFitPref('${key}','${val}')">${label}</div>`;
    const grp = (label, inner) => `<div><div style="font-size:12px;color:var(--text2);margin-bottom:6px">${label}</div><div class="sx">${inner}</div></div>`;
    return wrap('希望条件', 'あなたに合う大学の提案に反映されます', `
      ${grp('地域（複数選択可）', REGIONS.map(r => `<div class="fp ${(prefs.regions || []).includes(r) ? 'on' : ''}" onclick="toggleFitRegion('${r}')">${r}</div>`).join(''))}
      ${grp('規模', opt('size', 'any', 'こだわらない') + opt('size', 'small', '小規模') + opt('size', 'medium', '中規模') + opt('size', 'large', '大規模'))}
      ${grp('選抜度', opt('selectivity', 'any', 'こだわらない') + opt('selectivity', 'high', '難関') + opt('selectivity', 'medium', '中程度') + opt('selectivity', 'low', '入りやすい'))}
      ${grp('気候', opt('climate', 'any', 'こだわらない') + opt('climate', 'warm', '温暖') + opt('climate', 'cold', '冷涼'))}
      ${grp('費用・奨学金', opt('financial', 'any', 'こだわらない') + opt('financial', 'important', '重視する'))}
      ${grp('優先度', opt('priority', 'baseball', '野球重視') + opt('priority', 'balanced', 'バランス') + opt('priority', 'academic', '学業重視'))}
      ${navBtns('完了', 'finishCompleteFlow()')}`);
  }

  // step 6 — completion moment
  return `<div class="anim">${header}
    <div class="sec" style="margin-top:40px;padding-bottom:40px;text-align:center">
      <div style="width:68px;height:68px;border-radius:18px;background:var(--green);margin:0 auto 20px;display:flex;align-items:center;justify-content:center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="t22" style="margin-bottom:8px">プロフィール完成度 ${comp.pct}%</div>
      <div class="t13" style="line-height:1.9;max-width:300px;margin:0 auto 26px">${comp.pct >= 100 ? 'すべて入力できました。マッチング率と大学提案が最新の情報で計算されます。' : '入力ありがとうございます。残りの項目を埋めると、さらに精度が上がります。'}</div>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto">
        <button class="btn btn-navy" onclick="S.analysisTab='fit';openSub('analysis')">適性診断を見る</button>
        <button class="btn btn-border" onclick="closeSub();go('colleges')">大学を探す</button>
        ${comp.pct < 100 ? `<button class="btn btn-border" onclick="openCompleteFlow(${(comp.sections.find(s => !s.done) || {}).step || 1})">未入力の項目を続ける</button>` : ''}
      </div>
    </div></div>`;
}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">

function t(key) {

// ── RECRUITING READINESS ────────────────────────────────────────────────────
// Each item is computed entirely from real Supabase data. Tapping an unfinished
// item routes the player to where they can complete it.
// Readiness panel = the readiness-flagged slice of the single milestone source.
function readinessChecklist() {
  return recruitingMilestones()
    .filter(m => m.readiness)
    .map(m => ({ key: m.key, label: m.label, done: m.done, action: m.action }));
}
function readinessPct() {
  const l = readinessChecklist();
  return Math.round(l.filter(i => i.done).length / l.length * 100);
}
function renderReadiness() {
  const list = readinessChecklist();
  const pct = readinessPct();
  return `<div style="padding:24px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <div class="t11">${t('readiness_title')}</div>
      <div style="font-size:24px;font-weight:800;color:var(--blue)">${pct}%</div>
    </div>
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    <div class="card" style="margin-top:14px;padding:2px 16px">
      ${list.map((i,idx)=>`<div style="display:flex;align-items:center;gap:10px;padding:12px 0;${idx<list.length-1?'border-bottom:1px solid var(--border)':''};cursor:pointer" onclick="${i.action}">
        <span style="width:22px;height:22px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:${i.done?'var(--green-bg)':'var(--amber-bg)'};color:${i.done?'var(--green)':'var(--amber)'}">${i.done?'✓':'!'}</span>
        <div style="flex:1;font-size:14px;color:${i.done?'var(--text2)':'var(--text)'}">${i.label}</div>
        ${i.done?'':'<span style="color:var(--blue);font-size:16px">›</span>'}
      </div>`).join('')}
    </div>
  </div>`;
}

function messagesCount() {
  return Object.values(BAP_STATE.messagesByContact || {}).reduce((n,a)=>n+(a?a.length:0), 0);
}

function renderHome() {
  const tasks = BAP_STATE.tasks || [];
  const contacts = BAP_STATE.contacts || [];

}

// Returning user: normal dashboard, with a compact "next steps" hint for any
// remaining setup items.

// ── アクションセンター（今日の最重要アクション） ─────────────────────────────
// The primary daily decision engine. Generates prioritized recruiting actions
// ONLY from real data, each with reason / impact / source / type. Ranked by
// impact → urgency. Completing the underlying data change removes the action.
async function markContactActioned(id) { await dbUpdate('coach_contacts', id, { last_activity_at: new Date().toISOString() }); }

function buildActionCenter() {
  const p = BAP_STATE.player || {};
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const missing = _dcProfileMissing();
  const contacts = BAP_STATE.contacts || [];
  const saved = (BAP_STATE.saved || []).length;
  const videos = (BAP_STATE.videos || []).length;
  const metrics = (BAP_STATE.metrics || []).length;
  const goals = (BAP_STATE.goals || []).length;
  const messages = _dcMessageCount();
  const inbound = _msgsFlat().filter(m => m.direction === 'inbound').length;
  const contacted = contacts.filter(c => c.status && c.status !== 'none').length;
  const A = [];
  const add = o => A.push(o); // {title, reason, impact(1-3), urgency, source, type, act, act2?}

  // Scheduled coach follow-ups that are due (Communication Center reminders).
  contacts.forEach(c => (BAP_STATE.messagesByContact[String(c.id)] || []).forEach(m => {
    if (!m.follow_up_at || m.follow_up_done) return;
    const d = daysUntil(m.follow_up_at);
    if (d == null || d > 1) return; // due today, tomorrow, or overdue
    add({
      type: 'outreach', impact: 3, urgency: d < 0 ? 10 : 9,
      title: `${c.coach_name || 'コーチ'} のフォローアップ`,
      reason: m.title ? `予定: ${m.title}` : '設定したフォローアップの期限です。',
      source: d < 0 ? `${-d}日超過` : d === 0 ? '本日' : '明日',
      act: `openSub('contact','${c.id}')`, act2: { label: '完了', act: `completeFollowUp('${m.id}')` },
    });
  }));

  // Follow-ups (highest urgency — stale outreach)
  contacts.filter(needsFollowUp).forEach(c => add({
    type: 'outreach', impact: 3, urgency: 9,
    title: `${c.coach_name || 'コーチ'} にフォローアップ`,
    reason: '送信から5日以上、返信の記録がありません。フォローで関心を維持できます。',
    source: `最終連絡 ${_daysAgo(c.last_activity_at)}日前`,
    act: `openSub('emailAsst','${c.id}')`, act2: { label: '対応済み', act: `markContactActioned('${c.id}')` },
  }));

  // Decision funnel: schools in 連絡中 / やり取り中 that have gone quiet.
  (BAP_STATE.saved || []).filter(s => ['contacting', 'conversation'].includes(decisionCode(s.decision_status))).forEach(s => {
    const col = findCollege(s.college_id); if (!col) return;
    const stageLabel = (DECISION_STATUS[decisionCode(s.decision_status)] || {}).label || '';
    const acts = collegeContacts(col.id).map(cc => cc.last_activity_at).filter(Boolean).sort();
    const last = acts.slice(-1)[0] || null;
    const daysAgo = last ? _daysAgo(last) : null;
    if (last && daysAgo != null && daysAgo < 7) return; // recent activity → not stale yet
    add({
      type: 'outreach', impact: 3, urgency: 8,
      title: `${col.name}: フォローアップ`,
      reason: `「${stageLabel}」の大学ですが、最近のやり取りがありません。フォローアップを検討しましょう。`,
      source: last ? `最終活動 ${daysAgo}日前` : 'コーチ活動の記録なし',
      act: `openHub('${col.id}','coaches')`, act2: { label: '段階を見る', act: `openHub('${col.id}','decision')` },
    });
  });

  if (missing.length > 0) add({ type: 'profile', impact: 3, urgency: 7, title: 'プロフィールを完成させる', reason: 'コーチが最初に確認する基本情報です。未完成だと検討されにくくなります。', source: `${missing.slice(0, 3).join('・')}が未入力`, act: 'openProfileEdit()' });
  if (contacts.length === 0) add({ type: 'outreach', impact: 3, urgency: 8, title: '最初のコーチに連絡する', reason: 'リクルートは自分から動くことで始まります。', source: 'コーチ連絡0件', act: 'openAddContact()' });
  if (videos === 0) add({ type: 'video', impact: 3, urgency: 6, title: 'ハイライト動画をアップロードする', reason: 'コーチが最初に見る資料です。動画がないと評価が始まりません。', source: '動画0本', act: 'openVideos()' });
  if (!hasNum(p.gpa)) add({ type: 'academics', impact: 3, urgency: 5, title: 'GPAを入力する', reason: '学業評価の基準です。志望校の学力基準との比較に必要です。', source: 'GPA未登録', act: 'openProfileEdit()' });
  if (!hasNum(p.toefl)) add({ type: 'academics', impact: 3, urgency: 5, title: 'TOEFLスコアを追加する', reason: '英語力の証明はNCAA出願資格に直結します。', source: 'TOEFL未登録', act: 'openProfileEdit()' });
  if (saved > 0 && contacts.length === 0) add({ type: 'outreach', impact: 3, urgency: 7, title: '志望校のコーチに連絡を始める', reason: '志望校はあるのに連絡がありません。まず接点を作りましょう。', source: `志望校${saved}校・連絡0件`, act: 'openAddContact()' });
  if (metrics === 0) add({ type: 'profile', impact: 2, urgency: 4, title: 'パフォーマンス指標を追加する', reason: '球速・走力などの数値がないと競技力を評価されにくいです。', source: '指標0件', act: "S.profileTab='metrics';go('profile')" });
  if ((BAP_STATE.seasons || []).length === 0 && (metrics > 0 || hasNum(p.gpa))) add({ type: 'profile', impact: 1, urgency: 3, title: 'シーズン記録を追加する', reason: '球速などをシーズンごとに記録すると、成長の推移が評価に反映されます（最新シーズンを重視）。', source: 'シーズン記録0件', act: 'openSeasonEdit()' });
  if (!hasNum(p.sat) && !hasNum(p.act)) add({ type: 'academics', impact: 2, urgency: 3, title: 'SAT / ACTスコアを追加する', reason: '学力の客観的証明になり、選抜度の高い学校で有利です。', source: 'SAT/ACT未登録', act: 'openProfileEdit()' });
  if (saved === 0) add({ type: 'camps', impact: 2, urgency: 3, title: '志望校を保存する', reason: '現実的な志望校リストが戦略の基礎になります。', source: '志望校0校', act: "S.collegeView='search';go('colleges')" });
  if (contacts.length > 0 && messages === 0) add({ type: 'outreach', impact: 2, urgency: 3, title: 'コーチとのやり取りを記録する', reason: '連絡履歴を残すとパイプラインを管理できます。', source: 'メッセージ0件', act: "go('coach')" });
  if (contacted >= 3 && inbound === 0) add({ type: 'outreach', impact: 2, urgency: 4, title: 'メール内容を見直す / 別のコーチを追加', reason: '複数送信しても返信がありません。文面の改善や対象拡大が有効です。', source: `${contacted}件送信・返信0`, act: 'openAddContact()' });
  if (goals === 0) add({ type: 'profile', impact: 1, urgency: 2, title: '進学目標を設定する', reason: '目標が明確だと計画とモチベーションを保てます。', source: '目標未設定', act: 'openAddGoal()' });

  A.sort((a, b) => b.impact - a.impact || b.urgency - a.urgency);
  return A.slice(0, 7);
}

function renderActionCenter() {
  const acts = buildActionCenter();
  const impLabel = i => i >= 3 ? { t: '高', b: 'b-red' } : i === 2 ? { t: '中', b: 'b-amber' } : { t: '低', b: 'b-gray' };
  const typeLabel = { profile: 'プロフィール', academics: '学力', outreach: 'コーチ', video: '動画', camps: '志望校', documents: '書類' };
  if (acts.length === 0) {
    return `<div style="padding:20px 20px 0">
      <div class="card" style="padding:20px;text-align:center">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">今日の最重要アクションはありません</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.7">主要な項目は完了しています。コーチへの連絡を継続し、進捗を維持しましょう。</div>
      </div>
    </div>`;
  }
  return `<div style="padding:20px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
      <div style="font-size:16px;font-weight:800;color:var(--text)">今日の最重要アクション</div>
      <span style="font-size:12px;color:var(--text3)">${acts.length}件</span>

// ── AIリクルーティングアドバイザー ───────────────────────────────────────────
// A context-aware "recruiting coach" card. Rule-based and grounded ONLY in the
// player's real Supabase state (no chatbot, no external knowledge, no fabricated
// rules). Always returns: 現在の状況 / 今日やるべきこと / 注意点. Updates on load.
function renderAdvisor() {
  const p = BAP_STATE.player;
  const icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><path d="M8 9h8M8 13h5"/></svg>';
  const head = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div style="width:30px;height:30px;border-radius:50%;background:var(--navy-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon}</div>
    <div>
      <div style="font-size:14px;font-weight:700;color:var(--text)">AIリクルーティングアドバイザー</div>
      <div style="font-size:11px;color:var(--text3)">あなたのデータに基づく提案</div>
    </div>
  </div>`;

  // Empty state — no profile yet.
  if (!p || !p.name) {
    return `<div style="padding:20px 20px 0">
      <div class="card" style="padding:18px 16px">
        ${head}
        <div style="font-size:14px;color:var(--text2);line-height:1.9">まずプロフィールを入力するとアドバイスが表示されます。</div>
        <button class="btn btn-navy" style="margin-top:14px;width:auto;padding:12px 22px" onclick="openProfileEdit()">プロフィールを入力</button>
      </div>
    </div>`;
  }

  const pct = readinessPct();
  const status = recruitingStatus();
  const milestones = recruitingMilestones();
  const saved = (BAP_STATE.saved || []).length;
  const contacts = (BAP_STATE.contacts || []).length;
  const actions = computeDailyActions().slice(0, 3);

  // 1) 現在の状況
  let situation;
  if (pct >= 80) situation = `準備はほぼ整っています（${pct}%）。今は「${status.label}」の段階です。`;
  else if (pct >= 40) situation = `順調に進んでいます（${pct}%）。今は「${status.label}」の段階です。`;
  else situation = `リクルーティングを始めたばかりです（${pct}%）。まずは基礎から固めていきましょう。`;
  const facts = [];
  if (contacts > 0) facts.push(`コーチ${contacts}件`);
  if (saved > 0) facts.push(`志望校${saved}校`);
  if (facts.length) situation += ` これまでに${facts.join('・')}を登録しています。`;

  // 3) 注意点 — only the critical readiness gaps (profile / coach / college).
  const cautionMap = {
    profile: 'プロフィールが未完成です。まず基本情報を揃えましょう。',
    coach: 'まだコーチに連絡していません。最初の一歩がリクルートの始まりです。',
    college: '志望校をまだ保存していません。候補を3校ほど選んでみましょう。',
  };
  const cautions = ['profile', 'coach', 'college']
    .filter(k => { const m = milestones.find(x => x.key === k); return m && !m.done; })
    .map(k => cautionMap[k]);

  return `<div style="padding:20px 20px 0">
    <div class="card" style="padding:18px 16px">
      ${head}

      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--text3);margin-bottom:6px">現在の状況</div>
      <div style="font-size:14px;color:var(--text);line-height:1.8;margin-bottom:16px">${situation}</div>

      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--text3);margin-bottom:8px">今日やるべきこと</div>
      ${actions.length === 0
        ? `<div style="font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:4px">大きな課題はありません。今のペースで継続し、コーチへの連絡を続けましょう。</div>`
        : `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:4px">
          ${actions.map((a,i)=>`<div style="display:flex;align-items:center;gap:12px">
            <span style="width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">${i+1}</span>
            <div style="flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--text)">${a.title}</div>
            <button style="border:1.5px solid var(--blue);background:var(--white);color:var(--blue);font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;flex-shrink:0" onclick="${a.act}">${a.cta}</button>
          </div>`).join('')}
        </div>`}

      ${cautions.length ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--amber);margin-bottom:8px">注意点</div>
        ${cautions.map(c=>`<div style="display:flex;gap:8px;font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:4px">
          <span style="color:var(--amber);flex-shrink:0">•</span><span>${c}</span>
        </div>`).join('')}
      </div>` : ''}

      <button class="btn btn-border" style="margin-top:16px;width:100%" onclick="openSub('analysis')">レベル適性を分析する</button>
    </div>
  </div>`;
}

// Reach / Target / Safety guide for a college, from real fields + player academics.
function collegeFit(c) {
  if (!c) return { label: '', badge: 'b-gray' };
  let s = 0;
  const acc = c.acceptance_rate;
  if (acc != null) { if (acc >= 75) s += 2; else if (acc >= 50) s += 1; else if (acc <= 30) s -= 2; else s -= 1; }
  if (c.division === 'D1') s -= 1;
  if (c.division === 'D3' || c.division === 'JUCO') s += 1;
  const gpa = parseFloat(BAP_STATE.player && BAP_STATE.player.gpa);
  if (!isNaN(gpa)) { if (gpa >= 3.5) s += 1; if (gpa < 2.5) s -= 1; }
  if (s >= 2) return { label: '安全校', badge: 'b-green' };
  if (s <= -1) return { label: '挑戦校', badge: 'b-amber' };
  return { label: '現実校', badge: 'b-blue' };
}

// Current recruiting status, derived from the shared player state.
function recruitingStatus() {
  const contacts = (BAP_STATE.contacts || []).length;
  const saved = (BAP_STATE.saved || []).length;
  const pct = readinessPct();
  if (contacts > 0) return { label: 'コーチ連絡中', badge: 'b-blue' };
  if (saved > 0) return { label: '志望校選定中', badge: 'b-navy' };
  if (pct >= 60) return { label: 'プロフィール準備完了', badge: 'b-green' };
  return { label: '準備中', badge: 'b-amber' };
}

// Coach-outreach CRM summary on the dashboard: active-by-status counts + a
// "next action due" list (contacts with a next_action, most stale first).
function renderCoachSummary() {
  const all = BAP_STATE.contacts || [];
  if (all.length === 0) return '';
  // Active = not closed. Count by status.
  const active = all.filter(c => c.status !== 'closed');
  const counts = {};
  active.forEach(c => { const s = c.status || 'none'; counts[s] = (counts[s] || 0) + 1; });
  const order = ['sent', 'opened', 'replied', 'interest', 'meeting', 'none'];
  const chips = order.filter(s => counts[s]).map(s => `<span class="badge ${(statusMeta[s] || {}).badge || 'b-gray'}">${(statusMeta[s] || {}).label || s} ${counts[s]}</span>`).join(' ');
  const fuCount = all.filter(needsFollowUp).length;
  const vel = recruitingVelocity();

  const due = all.filter(c => c.next_action && c.status !== 'closed')

  return `<div class="sec" style="margin-top:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="t11">アクティブなコーチ対応（${active.length}件）</div>

// Reads the PUBLIC `camps` table (BAP_STATE.camps), empty until imported — same
// adapter pattern as colleges. Recommendations reuse the existing recruiting
// intelligence only (match score, saved schools, readiness, roadmap goal).
function campDivs(c) { return (c.divisions || '').split(/[,\s]+/).map(s => s.trim()).filter(Boolean); }
function campSchoolNames(c) { return (c.schools || '').split(/[;,]/).map(s => s.trim()).filter(Boolean); }
function findCamp(id) { return (BAP_STATE.camps || []).find(x => String(x.id) === String(id)) || null; }
function fmtCost(n) { return (n == null || n === '') ? '—' : '$' + Number(n).toLocaleString('en-US'); }

// Saved colleges that are attending this camp (matched by name).
function campSavedAttending(c) {
  const names = campSchoolNames(c).map(s => s.toLowerCase());
  if (!names.length) return [];
  const saved = (BAP_STATE.saved || []).map(s => findCollege(s.college_id)).filter(Boolean);
  return saved.filter(col => { const cn = (col.name || '').toLowerCase(); return names.some(n => cn.includes(n) || n.includes(cn)); });
}

// Look up a college in the DB by (fuzzy) name — camp host schools use slightly
// different naming than the college table.
function findCollegeByName(name) {
  if (!name) return null;
  const n = name.toLowerCase().trim();
  const cols = BAP_STATE.colleges || [];
  let hit = cols.find(c => (c.name || '').toLowerCase() === n);
  if (hit) return hit;
  return cols.find(c => { const cn = (c.name || '').toLowerCase(); return cn && (cn.includes(n) || n.includes(cn)); }) || null;
}

// Per-camp RAW recruiting value from per-camp signals (the things that actually
// differ between camps): your fit for the host program, whether it's a saved
// school, division-goal match, and camp timing. Global preparedness is a mild
// term (it shifts every camp equally, so it can't rank them). Reuses existing
// match-score intelligence only.
function campRawValue(c) {
  const savedAtt = campSavedAttending(c);
  const hostCol = findCollegeByName(campSchoolNames(c)[0] || '');
  const hostMatch = hostCol ? computeMatch(hostCol).score : null;
  const goal = roadmapGoal();
  const divs = campDivs(c);
  const divMatch = divs.includes(goal);
  const fit = savedAtt.length
    ? Math.round(savedAtt.map(x => computeMatch(x).score).reduce((a, b) => a + b, 0) / savedAtt.length)
    : (hostMatch != null ? hostMatch : (divMatch ? 60 : 50));
  let v = fit;
  if (savedAtt.length) v += 12;          // a school you actually target = high value
  if (divMatch) v += 6;                  // matches your division goal
  if (c.camp_date) {                     // timing / recruiting-window relevance (calendar-date based)
    const days = daysUntil(c.camp_date);
    if (days != null) {
      if (days < 0) v -= 15;             // already past
      else if (days <= 45) v += 8;       // soon (includes today = 0)
      else if (days <= 120) v += 4;
      else if (days > 240) v -= 4;       // far off
    }
  }
  v += (readinessPct() - 55) * 0.1;      // mild global term
  return v;
}

// Rank ALL camps by raw value once, cache, and expose each camp's percentile
// (0-100). Recomputes only when the player's data or camp set changes.
let _campRankCache = null, _campRankSig = '';
function _campSig() {
  const p = BAP_STATE.player || {};
  return [(BAP_STATE.camps || []).length, (BAP_STATE.saved || []).length, (BAP_STATE.metrics || []).length,
    (BAP_STATE.videos || []).length, (BAP_STATE.contacts || []).length, p.gpa, p.sat, p.act, p.toefl, p.grad_year,
    roadmapGoal(), new Date().toDateString()].join('|');
}
function campRankIndex() {
  const sig = _campSig();
  if (_campRankCache && _campRankSig === sig) return _campRankCache;
  // Rank only UPCOMING camps, so the percentile bands reflect actionable options.
  const camps = (BAP_STATE.camps || []).filter(c => { const d = daysUntil(c.camp_date); return d == null || d >= 0; });
  const raws = camps.map(c => ({ id: c.id, v: campRawValue(c) }));
  const sorted = [...raws].sort((a, b) => a.v - b.v);
  const n = sorted.length || 1;
  const pctMap = {};
  sorted.forEach((r, idx) => { pctMap[r.id] = Math.round(((idx + 0.5) / n) * 100); });
  _campRankCache = { pctMap };
  _campRankSig = sig;
  return _campRankCache;
}

// Relative BAP recommendation: stars are PERCENTILE BANDS across all 215 camps,
// so the distribution spreads (only the top ~8% are 5★). The numeric value is the
// percentile itself and drives sorting. Reasons/benefits explain it from the same
// existing signals (match score, readiness, video, coach outreach).
function campRecommendation(c) {
  const p = BAP_STATE.player || {};
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  const savedAtt = campSavedAttending(c);
  const hasVideo = (BAP_STATE.videos || []).length > 0;
  const contacts = (BAP_STATE.contacts || []).length;
  const messages = _dcMessageCount();
  const profileDone = _dcProfileMissing().length === 0;
  const hasAcademics = hasNum(p.gpa) || hasNum(p.sat) || hasNum(p.act);
  const hasToefl = hasNum(p.toefl);

  const hostCol = findCollegeByName(campSchoolNames(c)[0] || '');
  const hostMatch = hostCol ? computeMatch(hostCol).score : null;
  let avgMatch = null, competitive = 0;
  if (savedAtt.length) {
    const scores = savedAtt.map(col => computeMatch(col).score);
    avgMatch = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    competitive = scores.filter(x => x >= 70).length;
  }

  // Relative value (percentile across all camps) → star bands.
  const value = campRankIndex().pctMap[c.id] != null ? campRankIndex().pctMap[c.id] : 50;
  const stars = value >= 92 ? 5 : value >= 75 ? 4 : value >= 30 ? 3 : value >= 10 ? 2 : 1;
  const label = stars >= 5 ? '強くおすすめ' : stars >= 4 ? 'おすすめ' : stars >= 3 ? '検討' : stars >= 2 ? '準備してから' : '現時点ではおすすめしません';

  // 「なぜこのフィットなのか」 — absolute signals + a RELATIVE verdict.
  const reasons = [];
  if (hostMatch != null) reasons.push(`この大学との総合フィットは${hostMatch}%です。`);
  else if (savedAtt.length && avgMatch != null) reasons.push(`保存した大学との平均フィットは${avgMatch}%です。`);
  if (savedAtt.length) reasons.push('保存した志望校が参加します。');
  reasons.push(profileDone ? 'プロフィールは完成しています。' : 'プロフィールがまだ完成していません。');
  reasons.push(hasVideo ? 'ハイライト動画があります。' : 'ハイライト動画がありません。');
  if (!hasAcademics) reasons.push('GPA・SAT・ACTが未登録です。');
  else if (!hasToefl) reasons.push('TOEFLスコアが未登録です。');
  if (contacts > 0 && messages > 0) reasons.push('現在コーチとのやり取りも進んでいます。');
  else if (!(contacts > 0)) reasons.push('コーチへの連絡がまだありません。');
  reasons.push(
    stars >= 5 ? '215校の中でも特に優先度の高いキャンプです。今年のうちに参加を検討する価値があります。'
    : stars >= 4 ? '優先度の高いキャンプです。上位の候補が難しい場合の有力な選択肢です。'
    : stars >= 3 ? '良いキャンプですが、他にもっと費用対効果の高い選択肢があります。'
    : stars >= 2 ? '費用対効果は限定的です。近隣・低費用の場合のみ検討しましょう。'
    : '現時点では、他のキャンプを優先することをおすすめします。');

  // 「参加すると期待できること」
  const benefits = [];
  if (stars >= 4) {
    if (savedAtt.length) benefits.push('保存した大学のコーチと直接話せる可能性があります。');
    benefits.push('現在のレベルを直接評価してもらえます。');
    if (hasVideo) benefits.push('ハイライト動画では伝わらないプレーを見てもらえます。');
    benefits.push('このリストの中では費用対効果が高いキャンプです。');
  } else if (stars >= 3) {
    benefits.push('現在のレベルを直接評価してもらえます。');
    benefits.push('参加は可能ですが、より優先度の高いキャンプを先に検討しましょう。');
  } else {
    benefits.push('このリストの中では費用対効果は高くありません。');
    benefits.push(savedAtt.length ? '志望校が参加する、より上位のキャンプを優先しましょう。' : '志望校が参加するキャンプを優先する方が成果が期待できます。');
  }

  const investment = stars >= 4 ? 'このリストの中で優先度の高いキャンプです。'
    : stars >= 3 ? '検討できますが、より優先度の高いキャンプがあります。'
    : '他のキャンプを優先することをおすすめします。';

  return { stars, label, value, savedAtt, competitive, avgMatch, hostMatch, hostCol, investment, reasons, benefits };
}

function _campStars(n) { return `<span style="color:var(--amber);letter-spacing:1px">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`; }

function filteredCamps() {
  const list = (BAP_STATE.camps || []).filter(c => {
    if (!S.campPast) { const d = daysUntil(c.camp_date); if (d != null && d < 0) return false; } // hide past camps by default
    if (S.campDiv && !campDivs(c).includes(S.campDiv)) return false;
    if (S.campState && (c.state || '') !== S.campState) return false;
    if (S.campMonth) { const m = c.camp_date ? (new Date(c.camp_date).getMonth() + 1) : null; if (String(m) !== S.campMonth) return false; }
    if (S.campSearch) { const q = S.campSearch.toLowerCase(); if (!((c.name || '').toLowerCase().includes(q) || (c.city || '').toLowerCase().includes(q))) return false; }
    return true;
  });
  if (S.campSort === 'bap') {
    // Rank by recruiting value for THIS player (highest worth-attending first).
    return list.map(c => ({ c, v: campRecommendation(c).value })).sort((a, b) => b.v - a.v || (a.c.camp_date || '').localeCompare(b.c.camp_date || '')).map(x => x.c);
  }
  return list.sort((a, b) => (a.camp_date || '').localeCompare(b.camp_date || ''));
}

function renderCollegeList(list) {
  if (list.length === 0) return `<div style="padding:40px 0;text-align:center;color:var(--text3);font-size:14px">該当する大学が見つかりませんでした</div>`;
  // Render a page at a time. Building all ~1,600 cards (each running computeMatch)
  // on every render is what made the 大学 tab slow to open.
  const _limit = S.colLimit || 40;
  const _rest = Math.max(0, list.length - _limit);
  const _more = _rest > 0
    ? `<div onclick="S.colLimit=(S.colLimit||40)+40;render()" style="margin:14px 0 4px;padding:14px;text-align:center;background:var(--white);border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:700;color:var(--blue);cursor:pointer">さらに表示（残り${_rest}校）</div>`
    : '';
  return list.slice(0, _limit).map(c => {
    const mt = computeMatch(c);
    // Key stats row (only the fields that are present).
    const stat = (label, val) => val == null || val === '' ? '' : `<div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:700;color:var(--text)">${val}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:1px">${label}</div>
    </div>`;
    const stats = [
      stat('学費/年', c.tuition != null ? fmtTuition(c.tuition) : ''),
      stat('合格率', c.acceptance_rate != null ? c.acceptance_rate + '%' : ''),
      stat('部員数', c.roster_size != null ? c.roster_size + '名' : ''),
    ].filter(Boolean).join('');
    return `<div class="card" style="padding:14px 16px;cursor:pointer" onclick="openHub('${c.id}')">
      <!-- Hierarchy: name → division → key stats -->
      <div style="display:flex;align-items:flex-start;gap:12px">
        ${schoolAvatar(c, 46)}
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700;line-height:1.35">${c.name}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${c.city}, ${c.state}${c.conference ? ' · ' + c.conference : ''}</div>
        </div>
        <div style="flex-shrink:0;text-align:center;background:var(--blue-soft);border-radius:10px;padding:6px 10px;min-width:80px">
          ${mt.infoShort
            ? `<div style="font-size:11px;font-weight:700;color:var(--text3);line-height:1.2">情報<br>不足</div>`
            : `<div style="font-size:19px;font-weight:800;color:${mt.band.color};line-height:1">${mt.score}%</div>
               <div style="font-size:8.5px;color:var(--text3);margin-top:1px;letter-spacing:0.3px">マッチング率</div>
               <div style="font-size:10px;font-weight:700;color:${mt.band.color};margin-top:3px;line-height:1.15">${mt.band.label}</div>`}
        </div>
      </div>
      ${mt.infoShort || !mt.reason ? '' : `<div style="font-size:11px;color:var(--text2);line-height:1.5;margin-top:8px">${mt.reason}</div>`}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <span class="badge b-navy">${c.division}</span>
        ${(()=>{const f=collegeFit(c);return f.label?`<span class="badge ${f.badge}">${f.label}</span>`:'';})()}
        ${c.scholarship?'<span class="badge b-green">奨学金あり</span>':''}
        ${c.intl_friendly?'<span class="badge b-blue">国際生受け入れ</span>':''}
      </div>
      ${stats ? `<div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${stats}</div>` : ''}
    </div>`;
  }).join('') + _more;
}

function renderCollegesInline() {
  const hasData = (BAP_STATE.colleges || []).length > 0;
  const results = filteredColleges();
  const countEl = document.getElementById('col-count');
  const listEl = document.getElementById('col-list');
  if (countEl) countEl.textContent = results.length;
  if (listEl) listEl.innerHTML = hasData
    ? (results.length ? renderCollegeList(results)
        : `<div style="padding:40px 0;text-align:center;color:var(--text3);font-size:14px">該当する大学が見つかりませんでした</div>`)
    : renderExplorerEmpty();
  // Re-sync the active (.on) highlight on the filter chips. Partial DOM updates
  // (so we don't lose the search box focus) mean we must flip these by hand.
  const divMap = { 'すべて': '', 'D1': 'D1', 'D2': 'D2', 'D3': 'D3', 'NAIA': 'NAIA', 'JUCO': 'JUCO' };
  const regMap = { '全地域': '', '西部': '西部', '中西部': '中西部', '南部': '南部', '北東部': '北東部' };
  document.querySelectorAll('.fp').forEach(el => {
    const text = el.textContent;
    if (text in divMap) el.classList.toggle('on', divMap[text] === S.cDiv);
    else if (text in regMap) el.classList.toggle('on', regMap[text] === S.cRegion);
  });
}

function renderSavedColleges() {
  const saved = (BAP_STATE.saved || []).slice();
  if (saved.length === 0) {
    return `<div style="padding:16px 20px">
      <div class="card" style="padding:28px 22px 32px;text-align:center">

          5段階の評価、そして自分だけのメモを残せます。

// ── COLLEGE WRITE FUNCTIONS (Supabase, guard-routed, refetch after) ──────────
async function saveCollege(collegeId) {
  if ((BAP_STATE.saved || []).some(s => String(s.college_id) === String(collegeId))) { S.collegeView='saved'; render(); return; }
  const ok = await dbInsert('saved_colleges', { college_id: collegeId, decision_status: 'saved' });
  if (ok) { S.collegeView = 'saved'; render(); }
}
async function deleteSavedCollege(savedId) { await dbDelete('saved_colleges', savedId); }
async function setCollegeRating(savedId, n) { await dbUpdate('saved_colleges', savedId, { personal_rating: n }); }
async function saveCollegeNotes(savedId, text) { await dbUpdate('saved_colleges', savedId, { notes: (text || '').trim() || null }); }

// ── RECRUITING DECISION LAYER (per saved school) ─────────────────────────────
// Recruiting funnel stages (the natural recruiting journey).
const DECISION_STATUS = {
  saved:        { label: '保存',         badge: 'b-gray' },
  contacting:   { label: '連絡中',       badge: 'b-blue' },
  conversation: { label: 'やり取り中',   badge: 'b-blue' },
  applying:     { label: '出願中',       badge: 'b-amber' },
  offer:        { label: 'オファー',      badge: 'b-green' },
  committed:    { label: '進学決定',      badge: 'b-green' },
  closed:       { label: '終了',         badge: 'b-gray' },
};
const DECISION_ORDER = ['saved', 'contacting', 'conversation', 'applying', 'offer', 'committed', 'closed'];
// Migrate any legacy (pre-funnel) codes on READ so old data still renders.
const DECISION_ALIAS = { interested: 'saved', active: 'contacting', waiting: 'contacting', applied: 'applying' };
function decisionCode(raw) { return raw ? (DECISION_ALIAS[raw] || raw) : ''; }
// リクルーティング段階 (relationship stage) is the SINGLE per-school status, held in
// decision_status. Older rows may only have the retired recruiting_status field, so
// schoolStage() reads decision_status and falls back to mapping the legacy value —
// nothing is lost and no data is rewritten. Optional backfill: public_profile /
// saved_colleges_stage_backfill.sql.
const RECRUIT_TO_STAGE = { interested: 'saved', researching: 'saved', planning: 'contacting', contacted: 'contacting', awaiting: 'conversation', applied: 'applying', declined: 'closed' };
function schoolStage(s) { if (!s) return ''; const d = decisionCode(s.decision_status); if (d) return d; return RECRUIT_TO_STAGE[s.recruiting_status] || ''; }

// ── RECRUITING CONTEXT — PURE DERIVATION LAYER (display normalization only) ───
// One deterministic interpreter that ENRICHES raw data with the display facts every
// feature was re-deriving: per-school status label/badge/active-muted, coach list,
// simple presence flags, and counts/timestamps.
//
// CONTRACT — this layer MUST NOT:
//   - rank or score anything
//   - filter the candidate set (all saved schools are always returned)
//   - infer "readiness" or "quality"
//   - produce any composite/health signal that drives decisions or ranking
// `profileSignals` are VISIBILITY FLAGS ONLY (presence/absence), never an evaluation.
function recruitingContext() {
  const p = BAP_STATE.player || {};
  const hasNum = v => !isNaN(parseFloat(v)) && parseFloat(v) > 0;
  // ALL saved schools, enriched, order preserved (no ranking, no filtering).
  const schools = (BAP_STATE.saved || []).map(s => {
    const c = findCollege(s.college_id);
    const code = decisionCode(s.decision_status);
    const meta = code ? DECISION_STATUS[code] : null;
    const active = !!code && code !== 'saved' && code !== 'closed';
    return {
      savedId: s.id, id: c ? c.id : s.college_id, exists: !!c,
      name: c ? c.name : ('大学 #' + s.college_id), division: c ? (c.division || '') : '', state: c ? (c.state || '') : '',
      decisionCode: code || null, decisionLabel: meta ? meta.label : '', badge: meta ? meta.badge : 'b-gray',
      active, muted: !active, notes: s.decision_note || '',
    };
  });
  const coaches = (BAP_STATE.contacts || []).map(cc => { const col = cc.college_id ? findCollege(cc.college_id) : null; return { id: cc.id, name: cc.coach_name || '', role: cc.coach_role || '', email: cc.coach_email || '', collegeId: cc.college_id || null, collegeName: col ? col.name : '' }; }).filter(x => x.name);
  // profileSignals — presence/absence VISIBILITY FLAGS only (NOT readiness/quality).
  const athReady = Object.keys(DIVISION_BENCH.athletic).some(k => latestMetricValue(k) != null);
  const missing = [];
  if (!athReady) missing.push('パフォーマンス指標');
  if (!hasNum(p.gpa)) missing.push('GPA');
  if (!hasNum(p.toefl)) missing.push('TOEFL');
  if (!(BAP_STATE.videos || []).length) missing.push('ハイライト動画');
  if (!(BAP_STATE.seasons || []).length) missing.push('シーズン記録');
  const profileSignals = { athReady, hasGpa: hasNum(p.gpa), hasToefl: hasNum(p.toefl), hasTest: hasNum(p.sat) || hasNum(p.act), hasVideo: (BAP_STATE.videos || []).length > 0, seasonCount: (BAP_STATE.seasons || []).length, missing };
  // Counts + last activity (grouping helpers / timestamps), derived not scored.
  const msgs = (BAP_STATE.contacts || []).flatMap(cc => BAP_STATE.messagesByContact[String(cc.id)] || []);
  const lastActivity = (BAP_STATE.contacts || []).map(c => c.last_activity_at).filter(Boolean).sort().slice(-1)[0] || null;
  const summary = { savedCount: schools.length, activeCount: schools.filter(x => x.active).length, coachCount: coaches.length, outboundCount: msgs.filter(m => m.direction === 'outbound').length, inboundCount: msgs.filter(m => m.direction === 'inbound').length, lastActivity };
  return { schools, coaches, profileSignals, summary };
}

// ── COACH ─────────────────────────────────────────────────────────────────
// ── RECRUITING PIPELINE AUTOMATION (deterministic, coach_contacts only) ──────
function _daysAgo(ts) { const d = daysUntil(ts); return d == null ? null : -d; }
// Follow-up needed: awaiting a reply (sent/opened) with no activity for 5+ days.
function needsFollowUp(c) {
  if (!['sent', 'opened'].includes(c.status)) return false;
  const d = _daysAgo(c.last_activity_at);
  return d != null && d >= 5;
}
// UI-only suggested next action from status (user can override).
const NEXT_ACTION_BY_STATUS = {
  none: '初回メールを送信', sent: 'フォローアップメールを送信', opened: 'フォローアップメールを送信',
  replied: '返信内容を確認し、面談を提案', interest: '日程を調整', meeting: '継続してフォロー', closed: '',
};
function suggestedNextAction(status) { return NEXT_ACTION_BY_STATUS[status || 'none'] || ''; }
// Pipeline stage grouping (opened folds into 送信済み).
const PIPELINE_STAGES = [
  { key: 'none', label: '未送信' }, { key: 'sent', label: '送信済み' }, { key: 'replied', label: '返信あり' },
  { key: 'interest', label: '興味あり' }, { key: 'meeting', label: '面談' }, { key: 'closed', label: '終了' },
];
function coachStage(status) {
  if (!status || status === 'none') return 'none';
  if (status === 'sent' || status === 'opened') return 'sent';
  if (['replied', 'interest', 'meeting', 'closed'].includes(status)) return status;
  return 'none';
}
// Weekly recruiting velocity from coach_messages timestamps + contact statuses.
function recruitingVelocity() {
  const cut = _cutDaysAgo(7);
  const msgs = _msgsFlat();
  const inWeek = m => { const t = m.sent_at || m.created_at; return t && new Date(t) >= cut; };
  const sentWeek = msgs.filter(m => m.direction === 'outbound' && inWeek(m)).length;
  const repliesWeek = msgs.filter(m => m.direction === 'inbound' && inWeek(m)).length;
  const contacts = BAP_STATE.contacts || [];
  const contacted = contacts.filter(c => c.status && c.status !== 'none').length;
  const replied = contacts.filter(c => ['replied', 'interest', 'meeting'].includes(c.status)).length;
  const rate = contacted ? Math.round(replied / contacted * 100) : null;
  return { sentWeek, repliesWeek, rate, contacted, replied };
}

// ── PLAYER CAREER HUB — season timeline: team info + baseball stats + metrics ──
const SEASON_TERMS = ['春', '夏', '秋', '冬'];
const GRADE_OPTIONS = ['中3', '高1', '高2', '高3', 'その他'];
const LEVEL_OPTIONS = ['Varsity', 'JV'];
// [key, label, step] — hitting & pitching production (display only, no scoring).
const HIT_STATS = [['avg', '打率', '0.001'], ['obp', '出塁率', '0.001'], ['slg', '長打率', '0.001'], ['ops', 'OPS', '0.001'], ['hr', '本塁打', '1'], ['rbi', '打点', '1'], ['sb', '盗塁', '1'], ['h', '安打', '1'], ['ab', '打数', '1'], ['r', '得点', '1'], ['gp', '試合数', '1']];
const PITCH_STATS = [['ip', '投球回', '0.1'], ['era', '防御率', '0.01'], ['whip', 'WHIP', '0.01'], ['k', '奪三振', '1'], ['bb', '与四球', '1'], ['w', '勝', '1'], ['l', '敗', '1'], ['sv', 'セーブ', '1']];
const STAT_LABEL = Object.fromEntries([...HIT_STATS, ...PITCH_STATS].map(([k, l]) => [k, l]));

// ── Per-season recruiting milestones (deterministic, real timestamps only) ────
// A season "starts" on the 1st of its term month (春=3,夏=6,秋=9,冬=12). Each
// season owns recruiting events from its start until the next season's start
// (the earliest season also owns anything before it). No fabricated dates.
function _seasonStartMs(s) {
  const seq = s.season_seq || 0; const year = Math.floor(seq / 4); const term = seq % 4;
  const month = [3, 6, 9, 12][term] || 1;
  return new Date(year, month - 1, 1).getTime();
}
// All recruiting events across the app, each with a real timestamp.
function recruitingMilestoneEvents() {
  const ev = [];
  const add = (ts, text) => { if (!ts) return; const d = new Date(ts); if (!isNaN(d)) ev.push({ ms: d.getTime(), iso: ts, text }); };
  (BAP_STATE.saved || []).forEach(s => { const c = findCollege(s.college_id); add(s.created_at, `志望校を保存: ${c ? c.name : ''}`); });
  (BAP_STATE.contacts || []).forEach(c => {
    add(c.created_at, `コーチを追加: ${c.coach_name || ''}`);
    (BAP_STATE.messagesByContact[String(c.id)] || []).forEach(m => { const meta = INTERACTION_META[interactionKind(m)] || { label: 'やり取り' }; add(m.sent_at || m.created_at, `${meta.label}: ${c.coach_name || ''}`); });
  });
  (BAP_STATE.videos || []).forEach(v => add(v.created_at, `動画をアップロード: ${v.title || videoKindJp(v.kind) || ''}`));
  (BAP_STATE.tasks || []).filter(t => t.status === 'done').forEach(t => add(t.created_at, `タスク完了: ${(t.text || '').replace(/^\[[^\]]+\]\s*/, '')}`));
  return ev;
}
// Events that fall within one season's window (bucketed by timestamp).
function milestonesForSeason(s) {
  const seasons = playerSeasons(); // ascending
  const idx = seasons.findIndex(x => String(x.id) === String(s.id));
  if (idx < 0) return [];
  const start = idx === 0 ? -Infinity : _seasonStartMs(seasons[idx]);
  const end = idx === seasons.length - 1 ? Infinity : _seasonStartMs(seasons[idx + 1]);
  return recruitingMilestoneEvents().filter(e => e.ms >= start && e.ms < end).sort((a, b) => a.ms - b.ms);
}

      ${pitcherFirst ? statCard('投球成績', PITCH_STATS) + statCard('打撃成績', HIT_STATS) : statCard('打撃成績', HIT_STATS) + statCard('投球成績', PITCH_STATS)}

      <div class="t11" style="margin-bottom:8px">測定値（球速・走力など）</div>
      <div class="card" style="padding:2px 16px;margin-bottom:18px">
        ${mkeys.map((k, i) => { const def = (BAP_STATE.metricDefs || []).find(d => d.metric_key === k); const unit = def ? def.unit : ''; return numRow('metrics', k, metricLabel(k), '0.01', unit, i, mkeys.length - 1); }).join('')}
      </div>

      <div class="t11" style="margin-bottom:8px">受賞・表彰（任意）</div>
      <textarea class="inp" style="min-height:52px;resize:vertical;margin-bottom:18px" placeholder="例: 県ベストナイン、地区大会MVP、主将" oninput="(S.seasonForm.info=S.seasonForm.info||{}).awards=this.value">${escapeHtml(g('info', 'awards'))}</textarea>

      <div class="t11" style="margin-bottom:8px">メモ（怪我・中断など・任意）</div>
      <textarea class="inp" style="min-height:52px;resize:vertical;margin-bottom:18px" placeholder="トレーニング内容・怪我・中断など" oninput="(S.seasonForm=S.seasonForm||{}).notes=this.value">${escapeHtml(f.notes)}</textarea>

      <button class="btn btn-navy" style="width:100%;margin-bottom:8px" onclick="saveSeason()">保存する</button>
      ${f.id ? `<button class="btn btn-border" style="width:100%" onclick="deleteSeason('${f.id}')">このシーズンを削除</button>` : ''}
    </div>
  </div>`;
}
async function saveSeason() {
  const f = S.seasonForm || {};
  const year = f.year || new Date().getFullYear(), term = f.term || 0;
  const label = `${year}年 ${SEASON_TERMS[term] || ''}`, seq = year * 4 + term;
  // metrics: only meaningful positive numbers. stats: any real number (0 is valid).
  const metrics = {};
  Object.keys(f.metrics || {}).forEach(k => { const n = parseFloat(f.metrics[k]); if (!isNaN(n) && n > 0) metrics[k] = n; });
  const stats = {};
  Object.keys(f.stats || {}).forEach(k => { const raw = f.stats[k]; if (raw !== '' && raw != null) { const n = parseFloat(raw); if (!isNaN(n) && n >= 0) stats[k] = n; } });
  const info = {};
  Object.keys(f.info || {}).forEach(k => {
    const raw = f.info[k];
    if (raw == null || String(raw).trim() === '') return;
    info[k] = (k === 'gpa') ? (isNaN(parseFloat(raw)) ? null : parseFloat(raw)) : String(raw).trim();
    if (info[k] == null) delete info[k];
  });
  const row = { season_label: label, season_seq: seq, metrics, stats, info, notes: (f.notes || '').trim() || null };
  const ok = f.id ? await dbUpdate('player_seasons', f.id, row) : await dbInsert('player_seasons', row);
  if (ok) { S.seasonForm = null; closeSub(); }
}
async function deleteSeason(id) { if (await dbDelete('player_seasons', id)) { S.seasonForm = null; closeSub(); } }

// Career progression trend from a numeric series (oldest→newest). Display only.
function _careerTrend(series, lowerBetter) {
  if (!series || series.length < 2) return null;
  const first = series[0], latest = series[series.length - 1];
  const better = lowerBetter ? (first - latest) : (latest - first);
  return { first, latest, dir: better > 1e-9 ? 'up' : better < -1e-9 ? 'down' : 'flat', count: series.length };
}
// Player Career Hub — the year-by-year recruiting record. Reads player_seasons.

  }

  // Career totals (counting stats only).

  const prog = [];

  const velo = metSeries('fastball_velocity').length ? metSeries('fastball_velocity') : metSeries('throwing_velocity');
  addProg('球速', velo, false, '');

  const arrow = d => d === 'up' ? '<span style="color:var(--green);font-weight:800">↑</span>' : d === 'down' ? '<span style="color:var(--amber);font-weight:800">↓</span>' : '<span style="color:var(--text3)">→</span>';

  return `<div class="anim">

      <button class="btn btn-border" style="flex:1" onclick="openSub('resume')">履歴書を見る</button>
    </div>

    ${totals.length ? `<div class="sec" style="margin-top:12px">

      </div>

    ${prog.length ? `<div class="sec" style="margin-top:20px">
      <div class="t11" style="margin-bottom:10px">成長の推移（初シーズン → 最新）</div>
      <div class="card" style="padding:2px 16px">
        ${prog.map((r, i) => `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;${i < prog.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
          <div style="font-size:14px;font-weight:600">${r.label}</div>
          <div style="font-size:13px;color:var(--text2)">${r.first}${r.unit} ${arrow(r.dir)} <b style="color:var(--text)">${r.latest}${r.unit}</b> <span style="font-size:11px;color:var(--text3)">（${r.count}季）</span></div>

// ============================================================================
// RECRUITING RÉSUMÉ — one deterministic builder, one renderer, multiple outputs.
// buildRecruitingResume() aggregates existing data into a normalized object.
// resumeSheetHtml() is the SINGLE renderer consumed by BOTH the in-app view and
// the PDF/print export (which therefore has no data logic of its own). Toggles
// affect PRESENTATION only — they never change the underlying data. No AI, no scoring.
// ============================================================================
function buildRecruitingResume() {
  const p = BAP_STATE.player || {};
  const num = v => { const n = parseFloat(v); return (!isNaN(n) && n > 0) ? n : null; };
  const posList = (p.position || '').split(/[,\/\s]+/).map(s => s.trim()).filter(Boolean);

  const player = {
    name: p.name || '', name_en: p.name_en || '', school: p.school || '',
    grad_year: p.grad_year || null,
    height_cm: num(p.height_cm), weight_kg: num(p.weight_kg),
    throws: p.throws || '', bats: p.bats || '',
    primary_pos: posList[0] || '', secondary_pos: posList.slice(1).join(', '),
    phone: p.phone || '', email: p.contact_email || p.email || '',
  };
  const academics = { gpa: num(p.gpa), toefl: num(p.toefl), sat: num(p.sat), act: num(p.act) };

  // Position-aware athletic evaluation (display only) via the existing analyzer.
  const dv = (p.target_division || '').split(',')[0].trim();
  const targetDiv = DIVISIONS.includes(dv) ? dv : 'D2';
  const a = analyzeDivision(targetDiv);
  const athletic = {
    role: ROLE_JP[a.ath.role] || '', roleKey: a.ath.role || '', division: targetDiv,
    score: _athValid(a.ath) ? a.ath.score : null,
    metrics: a.athDetail.map(d => ({ key: d.key, label: d.label, value: d.value, unit: d.unit, target: d.target, ok: d.ok, trend: d.trend })),
  };

  const has = v => v != null && v !== '';
  const career = playerSeasons().map(s => {
    const info = s.info || {}, stats = s.stats || {}, m = s.metrics || {};
    return {
      label: s.season_label || '', grade: info.grade || '', school: info.school || '',
      level: info.level || '', position: info.primary_pos || '', jersey: info.jersey || '',
      coach: info.coach || '', record: info.record || '', gpa: num(info.gpa), awards: info.awards || '',
      hitting: HIT_STATS.filter(([k]) => has(stats[k])).map(([k, l]) => ({ key: k, label: l, val: stats[k] })),
      pitching: PITCH_STATS.filter(([k]) => has(stats[k])).map(([k, l]) => ({ key: k, label: l, val: stats[k] })),
      metrics: Object.keys(m).filter(k => has(m[k])).map(k => ({ key: k, label: metricLabel(k), val: m[k] })),
      videos: videosForSeason(s.id).map(v => ({ title: v.title || videoKindJp(v.kind) || '動画', link: (v.storage_path && /^https?:\/\//.test(v.storage_path)) ? v.storage_path : '' })),
      milestones: milestonesForSeason(s).map(e => ({ date: fmtDateJP(e.iso), text: e.text })),
    };
  });

  // School + coach display facts come from the shared recruiting context (status
  // label / active flag). The résumé does not re-derive them.
  const ctx = recruitingContext();
  const schools = ctx.schools.filter(x => x.exists).map(x => ({ name: x.name, division: x.division, decision: x.decisionLabel, active: x.active }));
  const coaches = ctx.coaches.map(c => ({ name: c.name, role: c.role, email: c.email, school: c.collegeName }));

  return { player, academics, athletic, career, recruiting: { schools, coaches } };
}

function _handedJP(code) { return code === 'R' ? '右' : code === 'L' ? '左' : code === 'S' ? '両' : ''; }

// THE single résumé renderer, driven by a composition config (content selection
// only — no data logic here). cfg = { sections:{profile,academics,athletic,seasons,
// recruiting,videos}, recruitingDepth:'limited'|'full', milestones:bool }.
// ── Security: ONE canonical HTML escaper + ONE canonical URL guard ───────────
// Used for every user-controlled value rendered on the public share page (and
// reusable app-wide). escapeHtml is safe in BOTH text and attribute contexts;
// sanitizeUrl is an allow-list that blocks javascript:/data:/vbscript: schemes.
function escapeHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function sanitizeUrl(v) {
  const s = String(v == null ? '' : v).trim();
  return /^(https?:|mailto:|tel:)/i.test(s) ? s : '';
}
// A safe href attribute value: scheme-checked, then attribute-escaped.
function safeHref(v) { return escapeHtml(sanitizeUrl(v)); }
// Canonical JS-string escaper for values placed inside inline on* handlers
// (e.g. onclick="fn('${escapeJs(x)}')"). Escapes backslash, quotes, newlines,
// and angle brackets so the string can't break out of the handler or the tag.
function escapeJs(v) {
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"')
    .replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
}

function resumeSheetHtml(d, cfg) {

  const DOT = ' <span style="color:' + FAINT + '">·</span> ';

      ${sec.profile ? `<div style="margin-top:13px">${[hw, handT, handB].filter(Boolean).map(chip).join('')}</div>

        const active = s.active;

        return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid ${LINE}">
          <span style="font-weight:700;color:${active ? INK : FAINT}">${esc(s.name)}</span>
          <span style="font-size:11.5px;color:${active ? MUTED : '#bbb'}">${esc(s.division || '')}</span>
          <span style="margin-left:auto">${pill}</span>
        </div>`;
      }).join('');
    }
    if (d.recruiting.coaches.length) {
      if (cfg.recruitingDepth === 'full') {
        html += `<div style="font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:${FAINT};text-transform:uppercase;margin:12px 0 2px">${en ? 'Coach contacts' : 'コーチ連絡先'}</div>` +
          d.recruiting.coaches.map(c => `<div style="font-size:13px;padding:5px 0;border-top:1px solid ${LINE};color:${BODY}"><span style="font-weight:700;color:${INK}">${esc(c.name)}</span>${c.role ? ` <span style="color:${MUTED}">(${esc(c.role)})</span>` : ''}${c.school ? ` — ${esc(c.school)}` : ''}${c.email ? `${DOT}<span style="color:${ACCENT}">${esc(c.email)}</span>` : ''}</div>`).join('');
      } else {
        html += `<div style="font-size:11px;color:${FAINT};margin-top:8px;font-style:italic">${en ? `Coach contacts are hidden in this mode (${d.recruiting.coaches.length})` : `コーチ連絡先はこのモードでは非表示です（${d.recruiting.coaches.length}件）`}</div>`;
      }
    }
  }

  html += '</div>';
  return html;
}

// SHAREABLE PLAYER PROFILE (public "digital recruiting card")
// A PRESENTATION LAYER ONLY. It introduces NO new data model and NO new
// aggregation: buildPlayerProfile() composes the existing buildRecruitingResume()
// output, applies a mode's redaction, and adds the featured video + contact block.
// The public page reuses resumeSheetHtml() for the detailed body. What leaves the
// app is a redacted SNAPSHOT stored in public_profiles and served, token-scoped,
// by the get_public_profile RPC (anon-safe; sensitive fields are stripped before save).
// ══════════════════════════════════════════════════════════════════════════
// Coach-facing share hides the 志望校 list (a college shouldn't see your other targets);
// it's kept for 家族用 (your own family) and 内部用 (yourself).
const PROFILE_MODES = {
  coach:    { label: 'コーチ用', sections: { profile: false, academics: true, athletic: true, seasons: true, recruiting: false, videos: true }, recruitingDepth: 'limited', milestones: false, showContact: true },
  family:   { label: '家族用',   sections: { profile: false, academics: true, athletic: true, seasons: true, recruiting: true,  videos: true }, recruitingDepth: 'limited', milestones: true,  showContact: true },
  internal: { label: '内部用',   sections: { profile: true,  academics: true, athletic: true, seasons: true, recruiting: true,  videos: true }, recruitingDepth: 'full',    milestones: true,  showContact: true },
};

// Build the shareable snapshot for a mode. Reuses buildRecruitingResume(); never
// re-derives facts. Sensitive fields are REDACTED here so they are never written
// to the public row (coach contact list is dropped unless mode is 'full').
function buildPlayerProfile(mode, lang) {
  const key = PROFILE_MODES[mode] ? mode : 'coach';
  const lg = lang === 'en' ? 'en' : 'ja';
  const m = PROFILE_MODES[key];
  const r = buildRecruitingResume(); // { player, academics, athletic, career, recruiting }
  const recruiting = {
    // 志望校 list is redacted out entirely unless the mode shows recruiting — a coach's
    // public card must not carry (or even store) the other schools you're targeting.
    schools: m.sections.recruiting ? r.recruiting.schools : [],
    coaches: m.recruitingDepth === 'full' ? r.recruiting.coaches : [], // redacted out for coach/family
  };
  const lv = latestSeasonVideo();
  const featuredVideo = (lv && lv.video && /^https?:\/\//.test(lv.video.storage_path || ''))
    ? { title: lv.video.title || videoKindJp(lv.video.kind) || 'ハイライト', link: lv.video.storage_path } : null;
  const contact = m.showContact ? { email: r.player.email || '', phone: r.player.phone || '' } : null;
  return {
    v: 1, mode: key, lang: lg, generatedAt: new Date().toISOString(),
    player: { name: r.player.name, name_en: r.player.name_en, school: r.player.school, grad_year: r.player.grad_year,
              height_cm: r.player.height_cm, weight_kg: r.player.weight_kg, throws: r.player.throws, bats: r.player.bats,
              primary_pos: r.player.primary_pos, secondary_pos: r.player.secondary_pos,
              phone: m.showContact ? r.player.phone : '', email: m.showContact ? r.player.email : '' },
    academics: r.academics, athletic: r.athletic, career: r.career, recruiting,
    featuredVideo, contact,
    resumeCfg: { sections: m.sections, recruitingDepth: m.recruitingDepth, milestones: m.milestones, hideHeader: true, lang: lg },
  };
}

// YouTube/Vimeo → responsive iframe; anything else → a tap-through link.
function _videoEmbed(url) {
  const esc = escapeHtml;
  let id = null, m;
  if ((m = String(url).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/))) id = m[1];
  if (id) return `<div style="position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000"><iframe src="https://www.youtube.com/embed/${esc(id)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe></div>`;
  if ((m = String(url).match(/vimeo\.com\/(\d+)/))) return `<div style="position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000"><iframe src="https://player.vimeo.com/video/${esc(m[1])}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe></div>`;
  return null;
}

// Public route: fetch the token-scoped snapshot via the anon-safe RPC and take over
// the page. No auth, no app shell. Returns true if it handled a public URL.
async function renderPublicProfile(token) {
  let data = null;
  try {
    if (window.BAP && BAP.client) {
      const { data: d, error } = await BAP.client.rpc('get_public_profile', { p_token: token });
      if (!error && d) data = d;
    }
  } catch (e) { console.warn('[BAP] public profile fetch failed:', e); }
  const nv = nav(); if (nv) nv.classList.remove('show');
  if (!data) { document.body.innerHTML = profileNotFoundHtml(); return; }
  document.title = (data.player && data.player.name ? data.player.name : '選手') + ' — Recruiting Profile';
  document.body.innerHTML = profilePageHtml(data);
}

// ── Share management (in-app) ────────────────────────────────────────────────
function _genToken() {
  const a = new Uint8Array(16); (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256));
  return Array.from(a).map(b => b.toString(36).padStart(2, '0')).join('').slice(0, 22);
}
// Public web base where the shareable profile page is served. Inside the native
// app location.origin is "capacitor://localhost", which a coach's browser can't
// open — so for share links we always use the real web address.
// NOTE: this must point at a host that actually serves the app so ?p=<token> renders.
const PUBLIC_BASE = 'https://app.ballersacrosspacific.com';
function shareUrlFor(token) {
  const o = location.origin || '';
  if (/^https?:/i.test(o)) return `${o}${location.pathname}?p=${token}`;   // running on the web
  return `${PUBLIC_BASE}/?p=${token}`;                                       // running in the native app
}
// Robust copy that also works in WKWebView (where navigator.clipboard is often
// unavailable because the origin isn't a secure http context).
async function _copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
function currentShare() { return BAP_STATE.publicProfile || null; }

async function publishProfile() {
  const uid = await _uidOrNull(); if (!uid) { alert('ログインが必要です'); return; }
  const mode = S.profileMode || 'coach';
  const lang = S.profileLang || 'ja';
  const existing = currentShare();
  const token = (existing && existing.token) || _genToken();
  const row = { player_id: uid, token, mode, data: buildPlayerProfile(mode, lang), is_public: true, updated_at: new Date().toISOString() };
  const { data, error } = await BAP.client.from('public_profiles').upsert(row, { onConflict: 'player_id' }).select().maybeSingle();
  if (error) { alert(bapDbError ? bapDbError(error, 'public_profiles') : (error.message || '公開できませんでした')); return; }
  BAP_STATE.publicProfile = data || row;
  render();
  setTimeout(() => { const s = currentShare(); if (s) loadShareQR(s.token); }, 60);
}
async function unpublishProfile() {
  const s = currentShare(); if (!s) return;
  const { error } = await BAP.client.from('public_profiles').update({ is_public: false }).eq('id', s.id);
  if (error) { alert(error.message || '停止できませんでした'); return; }
  BAP_STATE.publicProfile = Object.assign({}, s, { is_public: false });
  render();
}
async function republishProfile() {
  const mode = S.profileMode || 'coach';
  const lang = S.profileLang || 'ja';
  const s = currentShare(); if (!s) { return publishProfile(); }
  const { data, error } = await BAP.client.from('public_profiles').update({ is_public: true, mode, data: buildPlayerProfile(mode, lang), updated_at: new Date().toISOString() }).eq('id', s.id).select().maybeSingle();
  if (error) { alert(error.message || '更新できませんでした'); return; }
  BAP_STATE.publicProfile = data || Object.assign({}, s, { is_public: true });
  render();
  setTimeout(() => { const x = currentShare(); if (x) loadShareQR(x.token); }, 60);
}
async function copyShareUrl() {
  const s = currentShare(); if (!s) return;
  const ok = await _copyText(shareUrlFor(s.token));
  toast(ok ? 'リンクをコピーしました' : 'コピーできませんでした。リンクを長押ししてコピーしてください。');

// Lazy-load a tiny QR lib (only when the share screen is shown) and render.
function loadShareQR(token) {
  const el = document.getElementById('qrBox'); if (!el) return;
  const draw = () => { try { el.innerHTML = ''; new window.QRCode(el, { text: shareUrlFor(token), width: 168, height: 168, correctLevel: window.QRCode.CorrectLevel.M }); } catch (e) { /* ignore */ } };
  if (window.QRCode) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw; document.head.appendChild(sc);
}

// PDF/print of the public page. A native web view blocks window.open popups, so we
// open the public page in the SYSTEM browser (Safari), where the user can use
// Share → プリント / PDFとして保存. Requires the profile to be published.
function printProfilePage() {
  const s = currentShare();
  if (!s || !s.is_public) { alert('先にプロフィールを公開してください。'); return; }
  window.open(shareUrlFor(s.token), '_system');
  toast('ブラウザで開きました。共有ボタンから「プリント」でPDF保存できます。');
}
// In-app preview: shows the coach-facing page INSIDE the app (no trip to Safari),

// The active library: the large curated sidecar (focus-library.js) when present,
// otherwise the inline fallback set above. Both share the same {t,jp,en} shape.
function focusLib() {
  const ext = (typeof window !== 'undefined') ? window.BAP_FOCUS_LIB : null;
  return (ext && ext.length) ? ext : FOCUS_LIB;
}
// Days since a fixed epoch (UTC-safe, local calendar day). Deterministic per day.
function _focusDayIndex(date) {
  const d = date || new Date();
  const dayNum = Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000);
  return dayNum;
}
// The card for a given day — same for everyone, repeats after the library cycles.
function focusForDay(date) {
  const lib = focusLib();
  const idx = ((_focusDayIndex(date) % lib.length) + lib.length) % lib.length;
  return lib[idx];
}
function todaysFocus() { return focusForDay(new Date()); }

// Rotating sign-off — subtle brand personality. Deterministic by day, so the
// attribution changes occasionally without ever feeling random.
const FOCUS_SIGNOFF = ['— BAP Recruiting', '— Recruit Smarter.', '— Trust the Process.', '— One Day at a Time.'];
function focusSignoff(date) {
  const i = ((_focusDayIndex(date) % FOCUS_SIGNOFF.length) + FOCUS_SIGNOFF.length) % FOCUS_SIGNOFF.length;
  return FOCUS_SIGNOFF[i];
}

// Deterministic "reality" snapshot for the morning briefing. All counts come from
// real Supabase state; nothing is fabricated. Categories are disjoint so they
// never double-count the same coach.
function briefingStats() {
  const contacts = (BAP_STATE.contacts || []).filter(c => c.status !== 'closed');
  const followUp = contacts.filter(needsFollowUp).length;                                    // sent/opened, ≥5 days idle (overdue)
  const awaiting = contacts.filter(c => ['sent', 'opened'].includes(c.status) && !needsFollowUp(c)).length; // sent, still reasonably waiting
  const nextActions = (typeof buildActionCenter === 'function') ? buildActionCenter().length : 0;
  return { nextActions, awaiting, followUp };
}
